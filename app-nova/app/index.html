<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CNT Estadístiques</title>
<meta name="description" content="Estadístiques del Juvenil A: el que anotem a l'acta comparat amb l'acta oficial de la federació">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0891b2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CNT Stats">
<link rel="apple-touch-icon" href="../../apple-touch-icon.png">
<link rel="icon" href="../../cnt-ios-192.png">
<style>
/* ============================================================
   CN Terrassa · Estadístiques (app v2)
   Mateix disseny que l'acta en directe (app-nova/acta): light, accent per categoria.
   ============================================================ */
:root{
  --bg:#f4f6f9; --surface:#fff; --surface-2:#f8fafc; --border:#e6eaf0;
  --text:#1e293b; --muted:#64748b; --faint:#94a3b8;
  --accent:#0891b2; --accent-soft:#e0f5fa;
  --ok:#16a34a; --ok-soft:#dcfce7; --bad:#dc2626; --bad-soft:#fee2e2; --warn:#b45309; --warn-soft:#fef3c7;
  --radius:14px; --radius-sm:10px;
  --shadow:0 1px 3px rgba(15,23,42,.06),0 4px 16px rgba(15,23,42,.05);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
.cat-juvenil{--accent:#0891b2;--accent-soft:#e0f5fa}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.35;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
a{color:var(--accent)}
.app{max-width:720px;margin:0 auto;padding:0 12px calc(40px + env(safe-area-inset-bottom))}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:.82rem}
h2{font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;margin-top:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 14px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface);font-weight:650;min-height:44px}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:.78rem;font-weight:650;background:var(--surface-2);border:1px solid var(--border);text-transform:none;letter-spacing:0;color:var(--text)}
.pill.ok{background:var(--ok-soft);border-color:transparent;color:#166534}
.pill.bad{background:var(--bad-soft);border-color:transparent;color:#991b1b}
.pill.warn{background:var(--warn-soft);border-color:transparent;color:#92400e}
.pill.live{background:var(--accent-soft);border-color:transparent;color:#155e75}
.notice{margin-top:10px;padding:10px 12px;border-radius:var(--radius-sm);background:var(--warn-soft);color:#78350f;font-size:.88rem;font-weight:600}
.notice.info{background:var(--accent-soft);color:var(--text)}
footer{text-align:center;color:var(--faint);font-size:.78rem;margin-top:22px}
footer a{color:var(--muted)}

/* ---------- Capçalera i pestanyes ---------- */
.top{display:flex;align-items:flex-start;gap:10px;padding:18px 4px 4px}
.top .tt{flex:1;min-width:0}
.brand{font-weight:800;font-size:1.25rem}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--border);background:var(--surface);font-size:1.15rem;flex:none}
.iconbtn.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.tabs{display:flex;gap:4px;margin-top:12px;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:3px}
.tabs button{flex:1;padding:8px 4px;border-radius:9px;font-weight:700;font-size:.9rem;color:var(--muted);min-height:38px}
.tabs button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.upd{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:8px;font-size:.78rem;color:var(--faint);min-height:18px}

/* ---------- Resum de temporada ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.kpi{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:9px 4px 8px;text-align:center;min-width:0}
.kpi b{display:block;font-size:1.2rem;font-weight:850;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi span{display:block;font-size:.66rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:700;margin-top:2px}
.kpi.ok b{color:var(--ok)} .kpi.bad b{color:var(--bad)}

/* ---------- Llista de partits ---------- */
.mrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:11px 4px;border-top:1px solid var(--border)}
.mrow:first-of-type{border-top:0}
.mrow .when{width:70px;flex:none;font-size:.8rem;color:var(--muted);line-height:1.25}
.mrow .when b{display:block;color:var(--text);font-size:.92rem}
.mrow .teams{flex:1;min-width:0;font-size:.92rem}
.mrow .teams div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .teams .rv{font-weight:750}
.mrow .res{flex:none;text-align:right}
.wl{display:inline-block;min-width:54px;text-align:center;padding:3px 8px;border-radius:8px;font-weight:850;font-variant-numeric:tabular-nums;background:var(--surface-2)}
.wl.w{background:var(--ok-soft);color:#166534} .wl.l{background:var(--bad-soft);color:#991b1b}
.st{display:block;font-size:.7rem;font-weight:700;margin-top:4px;color:var(--faint)}
.st.ok{color:var(--ok)} .st.bad{color:var(--bad)} .st.warn{color:var(--warn)} .st.live{color:var(--accent)}

/* ---------- Partit ---------- */
.mhead{position:sticky;top:0;z-index:20;background:var(--bg);margin:0 -12px;padding:8px 12px 8px;border-bottom:1px solid var(--border)}
.sb{display:flex;align-items:center;gap:8px}
.back{width:40px;height:40px;border-radius:12px;border:1px solid var(--border);background:var(--surface);font-size:1.1rem;flex:none}
.score{flex:1;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;min-width:0}
.score .tm{font-size:.8rem;font-weight:700;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score .tm.r{text-align:right}
.score .num{font-size:1.9rem;font-weight:850;font-variant-numeric:tabular-nums;line-height:1;text-align:center;min-width:92px}
.score .q{display:block;font-size:.72rem;font-weight:700;color:var(--accent);text-align:center;margin-top:2px}
.fedline{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px;margin-top:6px;min-height:22px}

/* ---------- Taules (com a l'acta: nosaltres · FCN) ---------- */
table.cmp{width:100%;border-collapse:collapse;font-size:.86rem;font-variant-numeric:tabular-nums}
table.cmp th{font-size:.7rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700;padding:6px 3px;text-align:center;border-bottom:1px solid var(--border);white-space:nowrap}
table.cmp th:nth-child(2),table.cmp td:nth-child(2){text-align:left}
table.cmp td{padding:8px 3px;text-align:center;border-bottom:1px solid var(--border)}
table.cmp tr.row{cursor:pointer}
table.cmp td.nm{max-width:0;width:40%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
table.cmp td.n{font-weight:800;width:26px}
table.cmp .z{color:var(--faint)}
table.cmp .d{display:inline-block;background:var(--bad-soft);color:#991b1b;border-radius:6px;padding:1px 5px;font-weight:800;white-space:nowrap}
table.cmp .d i{font-style:normal;font-weight:600;opacity:.75}
table.cmp .f{color:var(--muted);font-weight:600}
table.cmp .tw{display:inline-block;border-radius:6px;padding:1px 5px;font-size:.72rem;font-weight:800;background:var(--accent-soft);color:#155e75}
table.cmp tr.bad td:first-child{box-shadow:inset 3px 0 0 var(--bad)}
table.cmp tr.np td{color:var(--faint)}
table.cmp tr.np td.nm{font-weight:500}
table.cmp tr.det td{background:var(--surface-2);text-align:left;font-size:.8rem;color:var(--muted);line-height:1.5}
table.cmp th[data-sort]{cursor:pointer;user-select:none}
table.cmp th.on{color:var(--accent)}
table.q th:first-child,table.q td:first-child{text-align:left}
table.q td{font-weight:700}
.legend{font-size:.78rem;color:var(--muted);margin-top:10px}
.legend summary{cursor:pointer;font-weight:650}
.legend dl{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin-top:8px}
.legend dt{font-weight:800;color:var(--text)}

/* ---------- Fitxa de jugador ---------- */
.shade{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:70;display:none}
.shade.show{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:80;background:var(--surface);border-radius:20px 20px 0 0;max-height:88vh;overflow:auto;padding:16px 16px calc(20px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .2s;max-width:720px;margin:0 auto}
.sheet.show{transform:translateY(0)}
.sheet h3{font-size:1.05rem;font-weight:800;margin-bottom:2px;padding-right:44px}
.sheet .x{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:10px;border:1px solid var(--border);color:var(--muted)}
.sheet .kpis{margin:12px 0 4px}
</style>
</head>
<body class="cat-juvenil">
<div class="app" id="app"></div>
<div class="shade" id="shade"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>

<script>
'use strict';
/* ============================================================
   Estadístiques del Juvenil A (temporada 2026-27)
   - La NOSTRA acta (app-nova/acta) publica cada partit a Firestore
     matches/acta_* (source:'acta'): gols, exclusions, canvis i titulars.
   - L'acta OFICIAL de la FCN la llegeix actawp_live.py i la deixa a la RTDB
     federacio/{matchId}: per jugador, marcador i parcials.
   Gols i expulsions sempre els nostres; la FCN només per comparar.
   Minuts i titularitat només surten de la nostra acta.
   ============================================================ */
const CAT = 'juvenil';
const CNT_TEAM = 'C.N. TERRASSA A';   // nom exacte a l'ACTAWP
const FS = 'https://firestore.googleapis.com/v1/projects/cnt-wp-stats-bb7dc/databases/(default)/documents';
const RTDB = 'https://cnt-wp-stats-bb7dc-default-rtdb.europe-west1.firebasedatabase.app';
const ACTAWP = 'https://actawp.natacio.cat/ca';
const CACHE = 'stats_v1_cache', SORT = 'stats_v1_sort';
const QNAMES = ['I', 'II', 'III', 'IV'];
// Columnes de l'acta (mateixes claus a la nostra acta i a la de la FCN)
const KEYS = {
  G: 'Gols', GP: 'Gols de penal', EX: 'Expulsions de 20 s', P: 'Faltes de penal', EP: 'Expulsió i penal',
  ED: 'Expulsió definitiva disciplinària', EB: 'Expulsió definitiva per brutalitat', EN: 'Expulsió definitiva no disciplinària',
  PF: 'Penals fallats', TG: 'Targeta groga', TV: 'Targeta vermella',
};
// Gols = jugada + penal (la tanda no compta). Expulsions = faltes personals, com el botó EX de l'acta.
const GOALS = s => s ? (s.G || 0) + (s.GP || 0) : 0;
const EXCL = s => s ? (s.EX || 0) + (s.P || 0) + (s.EP || 0) : 0;
const OUTS = s => s ? (s.ED || 0) + (s.EB || 0) + (s.EN || 0) : 0;

/* ---------- utilitats ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toArr = x => Array.isArray(x) ? x.filter(Boolean) : (x && typeof x === 'object' ? Object.values(x) : []);
const norm = s => String(s || '').trim().replace(/\s+/g, ' ').toUpperCase();
const isCnt = n => norm(n) === CNT_TEAM;
const title = s => String(s || '').toLocaleLowerCase('ca').replace(/(^|[\s'’-])(\p{L})/gu, (m, a, b) => a + b.toLocaleUpperCase('ca'));
// "MARC CAMPAÑA SALVADOR" → "Marc Campaña" (taules estretes)
const short = n => title(String(n || '').trim().split(/\s+/).slice(0, 2).join(' '));
// "C.N. ATL BARCELONETA" → "Atl Barceloneta"
const teamShort = n => title(String(n || '').replace(/^(C\.?\s?[NEW]\.?|U\.?\s?E\.?|CLUB\s+NATACI[OÓ])\s+/i, '').trim());
function mmss(ms) { const s = Math.max(0, Math.round(ms / 1000)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
const mins = ms => Math.round(ms / 60000);
function ago(t) {
  if (!t) return '';
  const s = Math.round((Date.now() - t) / 1000);
  if (s < 60) return 'fa ' + Math.max(s, 1) + ' s';
  if (s < 3600) return 'fa ' + Math.round(s / 60) + ' min';
  if (s < 86400) return 'fa ' + Math.round(s / 3600) + ' h';
  return 'fa ' + Math.round(s / 86400) + ' d';
}
const fmtDay = d => d.toLocaleDateString('ca-ES', {weekday: 'short', day: '2-digit', month: '2-digit', timeZone: 'Europe/Madrid'});
const fmtTime = d => d.toLocaleTimeString('ca-ES', {hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Madrid'});
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};

/* ============================================================
   Dades
   ============================================================ */
// Valors tipats de l'API REST de Firestore → JSON
function fromFs(v) {
  if (!v || typeof v !== 'object') return null;
  if ('mapValue' in v) return Object.fromEntries(Object.entries(v.mapValue.fields || {}).map(([k, x]) => [k, fromFs(x)]));
  if ('arrayValue' in v) return (v.arrayValue.values || []).map(fromFs);
  if ('integerValue' in v) return Number(v.integerValue);
  if ('doubleValue' in v) return Number(v.doubleValue);
  if ('booleanValue' in v) return v.booleanValue;
  if ('nullValue' in v) return null;
  if ('stringValue' in v) return v.stringValue;
  if ('timestampValue' in v) return v.timestampValue;
  return null;
}
async function getJson(url, opt) {
  const r = await fetch(url, opt);
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  return r.json();
}
// Les nostres actes (una per partit; l'app de l'acta les publica a Firestore)
async function loadActas() {
  const rows = await getJson(FS + ':runQuery', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({structuredQuery: {from: [{collectionId: 'matches'}],
      where: {fieldFilter: {field: {fieldPath: 'source'}, op: 'EQUAL', value: {stringValue: 'acta'}}}}}),
  }).catch(e => { throw new Error('No puc llegir les actes (' + e.message + ')'); });
  return rows.filter(r => r.document).map(r => fromFs({mapValue: {fields: r.document.fields}})).filter(a => a && a.teamId === CAT);
}
// Actes oficials que ha llegit el lector (només el que fem servir: el minut a minut no cal)
function slimFed(d) {
  const keep = ['matchId', 'tournamentId', 'category', 'datetime', 'home', 'away', 'score', 'periods', 'finished', 'players', 'statsAt', 'actaUrl'];
  return Object.fromEntries(keep.filter(k => d[k] !== undefined).map(k => [k, d[k]]));
}
async function loadFeds(extraIds) {
  const ids = new Set(extraIds);
  try { Object.keys(await getJson(`${RTDB}/federacio.json?shallow=true`) || {}).forEach(id => ids.add(id)); } catch (e) {}
  const out = {};
  await Promise.all([...ids].map(async id => {
    try { const d = await getJson(`${RTDB}/federacio/${encodeURIComponent(id)}.json`); if (d) out[id] = slimFed(d); } catch (e) {}
  }));
  return out;
}

let S = {actas: [], feds: {}, at: 0};
let busy = false, err = null;
let MATCHES = [], PLAYERS = [];
const openRows = new Set();
let sort = LS.get(SORT, {k: 'num', dir: 1});

async function refresh() {
  if (busy) return;
  busy = true; err = null; paintUpd();
  try {
    const actas = await loadActas();
    const feds = await loadFeds(actas.map(a => a.fedMatchId).filter(Boolean).map(String));
    S = {actas, feds, at: Date.now()};
    LS.set(CACHE, S);
    build();
  } catch (e) {
    err = navigator.onLine === false ? 'Sense connexió: dades desades al mòbil' : e.message;
  }
  busy = false;
  render();
}

/* ---------- model ---------- */
// L'acta FCN té dades si algun jugador té algun valor (abans del partit tot surt a zero)
function fedHasData(f) {
  for (const side of ['home', 'away']) for (const p of toArr(f && f.players && f.players[side]))
    for (const k in KEYS) if (p.s && p.s[k]) return true;
  return false;
}
// Columnes de la nostra acta per a un jugador (les actes antigues només tenen gols/exclusions)
function ourStats(j) {
  if (!j || !j.estadistiques) return {};
  const e = j.estadistiques;
  if (e.acta) return e.acta;
  const pen = (e.goalTypes && e.goalTypes.penalty) || 0, epen = (e.exclusionTypes && e.exclusionTypes.penalty) || 0;
  return {G: (e.gols || 0) - pen, GP: pen, EX: (e.exclusions || 0) - epen, P: epen};
}
// Temps de joc de cada dorsal (ms). L'acta publica temps de joc: cada quart acabat dura 8:00.
function playMs(a) {
  const res = {};
  const add = (n, ms) => { if (ms > 0) res[n] = (res[n] || 0) + ms; };
  for (let q = 1; q <= 4; q++) {
    const s = a.quarterStartTimes && a.quarterStartTimes['q' + q], e = a.quarterRealEndTimes && a.quarterRealEndTimes['q' + q];
    if (s == null || e == null) continue;
    const inW = new Map(toArr(a.lineups && a.lineups['q' + q]).map(n => [n, s]));
    const ch = toArr(a.playerWaterChanges).filter(c => c.quarter === 'q' + q).sort((x, y) => x.timestamp - y.timestamp);
    for (const c of ch) {
      const t = Math.min(Math.max(c.timestamp, s), e);
      if (c.action === 'in') { if (!inW.has(c.playerNum)) inW.set(c.playerNum, t); }
      else if (inW.has(c.playerNum)) { add(c.playerNum, t - inW.get(c.playerNum)); inW.delete(c.playerNum); }
    }
    for (const [n, t] of inW) add(n, e - t);
  }
  return res;
}

function makeMatch(a, f) {
  // Si el document de la RTDB no hi és, la còpia de l'acta FCN que va guardar la nostra acta
  if (!f && a && a.fcn && a.fcn.players) {
    f = {players: {home: a.fcn.players.cnt, away: a.fcn.players.rival}, periods: [],
         home: {name: CNT_TEAM}, away: {name: a.rivalTeam}, statsAt: a.fcn.statsAt,
         score: a.fcn.score ? {home: a.fcn.score.cnt, away: a.fcn.score.rival} : null,
         matchId: a.fcn.matchId, tournamentId: a.fcn.tournamentId};
  }
  const side = f && isCnt(f.home && f.home.name) ? 'home' : f && isCnt(f.away && f.away.name) ? 'away'
    : (a && a.matchLocation === 'away') ? 'away' : 'home';
  const rs = side === 'home' ? 'away' : 'home';
  const fReady = !!f && fedHasData(f);
  const fScore = f && f.score && f.score.home != null ? {cnt: f.score[side], rival: f.score[rs]} : null;
  const ours = a ? {cnt: a.scoreCNT || 0, rival: a.scoreRival || 0} : null;
  const per = f ? toArr(f.periods) : [];
  const quarters = [1, 2, 3, 4].map(q => {
    const o = a && a.periodScores && a.periodScores['q' + q];
    const p = per.find(x => x.name === QNAMES[q - 1]);
    return {q, ours: o ? [o.cnt || 0, o.rival || 0] : null, fcn: p && p.home != null ? [p[side], p[rs]] : null};
  });

  const ms = a ? playMs(a) : {};
  const starters = a ? (toArr(a.starters).length ? toArr(a.starters) : toArr(a.lineups && a.lineups.q1)) : [];
  const fl = f && f.players ? toArr(f.players[side]) : [];
  const fBy = new Map(fl.map(p => [+p.num, p]));
  const oBy = new Map((a ? toArr(a.jugadors) : []).map(j => [+j.numero, j]));
  const nums = [...new Set([...oBy.keys(), ...fBy.keys()])].filter(n => n > 0).sort((x, y) => x - y);
  const players = [];
  for (const num of nums) {
    const o = oBy.get(num), fp = fBy.get(num);
    const ourName = o && o.nom && !/^#\d+$/.test(o.nom) ? o.nom : '';
    const name = (fp && fp.name) || ourName;
    const os = a ? ourStats(o) : null;
    const fs = fReady ? ((fp && fp.s) || {}) : null;
    const t = a ? (ms[num] || 0) : null;
    const starter = a ? starters.includes(num) : null;
    const played = a ? (t > 0 || starter || GOALS(os) + EXCL(os) + OUTS(os) > 0) : !!(fs && GOALS(fs) + EXCL(fs) + OUTS(fs));
    if (!name && !played && !(fs && GOALS(fs) + EXCL(fs))) continue;   // dorsal buit de la plantilla
    players.push({num, name, key: norm(name) || '#' + num, ours: os, fcn: fs, ms: t, starter, played,
                  captain: !!(fp && fp.captain), dG: !!fs && a && GOALS(os) !== GOALS(fs), dE: !!fs && a && EXCL(os) !== EXCL(fs)});
  }

  const scoreDiff = !!(ours && fScore && (ours.cnt !== fScore.cnt || ours.rival !== fScore.rival));
  const qDiffs = quarters.filter(x => x.ours && x.fcn && (x.ours[0] !== x.fcn[0] || x.ours[1] !== x.fcn[1])).length;
  const pDiffs = players.reduce((n, p) => n + p.dG + p.dE, 0);
  const date = new Date((f && f.datetime) || (a && a.data) || 0).getTime();
  return {
    id: a ? a.id : 'fed_' + f.matchId, acta: a, fed: f, side, date,
    rival: (f && f[rs] && f[rs].name) || (a && a.rivalTeam) || 'Rival',
    home: side === 'home', friendly: !!a && !a.fedMatchId,
    live: a ? a.estat !== 'finished' : !f.finished,
    ours, fScore, fReady, quarters, players, scoreDiff, qDiffs, pDiffs,
    diffs: (a && fReady) ? pDiffs + qDiffs + (scoreDiff ? 1 : 0) : 0,
  };
}

function build() {
  const used = new Set();
  MATCHES = S.actas.map(a => {
    const f = a.fedMatchId ? S.feds[String(a.fedMatchId)] : null;
    if (f) used.add(String(a.fedMatchId));
    return makeMatch(a, f);
  });
  // Partits que el lector ha llegit però dels quals no tenim acta nostra
  for (const [id, f] of Object.entries(S.feds)) {
    if (used.has(id) || f.category !== CAT || !(isCnt(f.home && f.home.name) || isCnt(f.away && f.away.name))) continue;
    if (!fedHasData(f)) continue;   // partit encara no jugat (el lector l'està esperant)
    MATCHES.push(makeMatch(null, f));
  }
  MATCHES.sort((x, y) => y.date - x.date);
  PLAYERS = aggregate(MATCHES.filter(m => m.acta));
}

// Totals per jugador: la clau és el nom (el dorsal pot canviar d'un partit a l'altre)
function aggregate(ms) {
  const map = new Map();
  for (const m of ms) for (const p of m.players) {
    if (!p.played && !(p.fcn && GOALS(p.fcn) + EXCL(p.fcn))) continue;
    let t = map.get(p.key);
    if (!t) map.set(p.key, t = {key: p.key, name: p.name, nums: {}, pj: 0, tit: 0, ms: 0, g: 0, exc: 0, outs: 0,
                                gC: 0, gF: 0, eC: 0, eF: 0, cmp: 0, rows: []});
    if (!t.name && p.name) t.name = p.name;
    t.nums[p.num] = (t.nums[p.num] || 0) + 1;
    if (p.played) t.pj++;
    if (p.starter) t.tit++;
    t.ms += p.ms || 0;
    t.g += GOALS(p.ours); t.exc += EXCL(p.ours); t.outs += OUTS(p.ours);
    if (p.fcn) { t.cmp++; t.gC += GOALS(p.ours); t.gF += GOALS(p.fcn); t.eC += EXCL(p.ours); t.eF += EXCL(p.fcn); }
    t.rows.push({m, p});
  }
  return [...map.values()].map(t => {
    const num = +Object.entries(t.nums).sort((x, y) => y[1] - x[1] || x[0] - y[0])[0][0];   // dorsal més habitual
    // "Segons la FCN": la FCN on hi ha acta FCN, la nostra on no n'hi ha
    return {...t, num, gFcn: t.g - t.gC + t.gF, eFcn: t.exc - t.eC + t.eF};
  });
}

function result(m) {
  const s = m.ours || m.fScore;
  if (!s) return {txt: '–', cls: ''};
  return {txt: `${s.cnt}-${s.rival}`, cls: s.cnt > s.rival ? 'w' : s.cnt < s.rival ? 'l' : ''};
}
function matchStatus(m) {
  if (!m.acta) return {cls: 'warn', txt: 'només FCN'};
  if (m.live) return {cls: 'live', txt: 'en joc'};
  if (m.friendly) return {cls: '', txt: 'amistós'};
  if (!m.fReady) return {cls: '', txt: 'sense acta FCN'};
  return m.diffs ? {cls: 'bad', txt: `≠ ${m.diffs} dif.`} : {cls: 'ok', txt: '✓ quadra'};
}

/* ============================================================
   Pantalles
   ============================================================ */
function route() {
  const h = location.hash;
  if (h.startsWith('#/p/')) return {view: 'match', id: decodeURIComponent(h.slice(4))};
  return {view: h === '#/jugadors' ? 'players' : 'matches'};
}
function render() {
  closeSheet();
  const r = route();
  if (r.view === 'match') {
    const m = MATCHES.find(x => x.id === r.id);
    if (m) return renderMatch(m);
    if (!busy && S.at) { location.hash = ''; return; }
  }
  renderHome(r.view === 'players' ? 'players' : 'matches');
}

function updLine() {
  if (busy) return 'Actualitzant…';
  if (err) return '';
  return S.at ? `Actualitzat ${ago(S.at)}` : '';
}
function paintUpd() {
  const u = $('#upd'); if (u) u.textContent = updLine();
  const b = $('#refresh'); if (b) b.classList.toggle('spin', busy);
}

function renderHome(tab) {
  let h = `
    <header class="top">
      <div class="tt"><div class="brand">📊 Estadístiques</div>
      <div class="muted small">Juvenil · ${esc(teamShort(CNT_TEAM))} · temporada 2026-27</div></div>
      <button class="iconbtn ${busy ? 'spin' : ''}" id="refresh" data-act="refresh" aria-label="Actualitzar">↻</button>
    </header>
    <div class="tabs">
      <button class="${tab === 'matches' ? 'on' : ''}" data-act="go" data-h="">Partits</button>
      <button class="${tab === 'players' ? 'on' : ''}" data-act="go" data-h="#/jugadors">Jugadors</button>
    </div>
    <div class="upd" id="upd">${esc(updLine())}</div>`;
  if (err) h += `<div class="notice">${esc(err)}</div>`;
  if (!S.at && busy) h += '<section class="card"><p class="muted">Carregant les actes…</p></section>';
  else h += tab === 'players' ? renderPlayers() : renderMatches();
  h += `<footer><a href="../acta/">Acta en directe</a><br>by Josep Rico</footer>`;
  $('#app').innerHTML = h;
}

/* ---------- Partits ---------- */
function renderMatches() {
  const ours = MATCHES.filter(m => m.acta && !m.friendly);
  let w = 0, d = 0, l = 0, gf = 0, gc = 0;
  for (const m of ours) {
    gf += m.ours.cnt; gc += m.ours.rival;
    if (m.live) continue;
    if (m.ours.cnt > m.ours.rival) w++; else if (m.ours.cnt < m.ours.rival) l++; else d++;
  }
  const withDiffs = ours.filter(m => m.diffs).length, compared = ours.filter(m => m.fReady).length;
  let h = `<section class="card"><h2>Temporada</h2><div class="kpis">
    <div class="kpi"><b>${ours.length}</b><span>Partits</span></div>
    <div class="kpi"><b>${w}-${d}-${l}</b><span>G-E-P</span></div>
    <div class="kpi"><b>${gf}:${gc}</b><span>Gols</span></div>
    <div class="kpi ${compared ? (withDiffs ? 'bad' : 'ok') : ''}"><b>${compared ? (withDiffs ? withDiffs : '✓') : '–'}</b><span>${withDiffs ? 'amb dif. FCN' : 'Acta FCN'}</span></div>
    </div></section>`;
  h += '<section class="card"><h2>Partits jugats</h2>';
  if (!MATCHES.length) h += '<p class="muted small">Encara no hi ha cap acta publicada. Les actes es fan a l\'app <a href="../acta/">Acta en directe</a>.</p>';
  for (const m of MATCHES) {
    const d0 = new Date(m.date), r = result(m), st = matchStatus(m);
    h += `<button class="mrow" data-act="go" data-h="#/p/${esc(encodeURIComponent(m.id))}">
      <div class="when"><b>${esc(fmtDay(d0))}</b>${esc(fmtTime(d0))}</div>
      <div class="teams"><div class="rv">${esc(teamShort(m.rival))}</div><div class="muted small">${m.friendly ? 'Amistós' : m.home ? 'A casa' : 'A fora'}</div></div>
      <div class="res"><span class="wl ${r.cls}">${esc(r.txt)}</span><span class="st ${st.cls}">${esc(st.txt)}</span></div>
    </button>`;
  }
  return h + '</section>';
}

/* ---------- Jugadors (totals) ---------- */
const SORTS = {
  num: [t => t.num, 1], name: [t => short(t.name || ''), 1], pj: [t => t.pj, -1], tit: [t => t.tit, -1],
  min: [t => t.ms, -1], g: [t => t.g, -1], exc: [t => t.exc, -1],
};
function sortedPlayers() {
  const [f] = SORTS[sort.k] || SORTS.num;
  return [...PLAYERS].sort((a, b) => {
    const x = f(a), y = f(b);
    const c = typeof x === 'string' ? x.localeCompare(y, 'ca') : x - y;
    return c * sort.dir || a.num - b.num;
  });
}
// Total nostre; en vermell, el total que surt amb la FCN (on hi ha acta FCN)
function totCell(o, fcn) { return o === fcn ? (o ? `<b>${o}</b>` : '<span class="z">·</span>') : `<span class="d">${o}<i> · ${fcn}</i></span>`; }

function renderPlayers() {
  const n = MATCHES.filter(m => m.acta).length, onlyF = MATCHES.filter(m => !m.acta).length;
  const noF = MATCHES.filter(m => m.acta && !m.fReady).length;
  const th = (k, l, t) => `<th data-sort="${k}" class="${sort.k === k ? 'on' : ''}" ${t ? `title="${esc(t)}"` : ''}>${l}${sort.k === k ? (sort.dir > 0 ? ' ▴' : ' ▾') : ''}</th>`;
  let h = `<section class="card"><h2>Totals · ${n} ${n === 1 ? 'partit' : 'partits'}</h2>`;
  if (!PLAYERS.length) return h + '<p class="muted small">Encara no hi ha dades de jugadors.</p></section>';
  h += `<table class="cmp"><thead><tr>${th('num', '#')}${th('name', 'Jugador')}${th('pj', 'PJ', 'Partits jugats')}${th('tit', 'Tit', 'Partits de titular')}${th('min', 'Min', 'Minuts jugats')}${th('g', 'Gols')}${th('exc', 'Exp', 'Expulsions (faltes personals)')}</tr></thead><tbody>`;
  for (const t of sortedPlayers()) {
    const bad = t.g !== t.gFcn || t.exc !== t.eFcn;
    h += `<tr class="row ${bad ? 'bad' : ''}" data-act="player" data-k="${esc(t.key)}"><td class="n">${t.num}</td><td class="nm">${esc(short(t.name)) || '<span class="faint">—</span>'}</td>
      <td>${t.pj || '<span class="z">·</span>'}</td><td>${t.tit || '<span class="z">·</span>'}</td><td>${t.ms ? mins(t.ms) + '′' : '<span class="z">·</span>'}</td>
      <td>${totCell(t.g, t.gFcn)}</td><td>${totCell(t.exc, t.eFcn)}${t.outs ? ' ⛔' : ''}</td></tr>`;
  }
  h += `</tbody></table>
    <details class="legend"><summary>Com es compta</summary><dl>
      <dt>PJ</dt><dd>Partits on ha entrat a l'aigua (segons la nostra acta).</dd>
      <dt>Tit</dt><dd>Partits que ha començat a l'aigua al Q1.</dd>
      <dt>Min</dt><dd>Minuts de joc: cada quart són 8:00 de rellotge de partit.</dd>
      <dt>Gols</dt><dd>Gols de jugada i de penal que hem anotat nosaltres.</dd>
      <dt>Exp</dt><dd>Faltes personals: expulsions de 20 s, faltes de penal i expulsió + penal (com el botó EX de l'acta). ⛔ = alguna expulsió definitiva.</dd>
      <dt><span class="pill bad">3 · 2</span></dt><dd>No quadra amb la FCN: el nostre total · el total amb les dades de l'acta FCN.</dd>
    </dl></details>`;
  if (noF || onlyF) h += `<p class="faint small" style="margin-top:8px">${noF ? `${noF} ${noF === 1 ? 'partit' : 'partits'} sense acta FCN (no es poden comparar). ` : ''}${onlyF ? `${onlyF} ${onlyF === 1 ? 'partit' : 'partits'} sense acta nostra (no compten als totals).` : ''}</p>`;
  return h + '</section>';
}

function playerSheet(key) {
  const t = PLAYERS.find(x => x.key === key); if (!t) return;
  const avg = t.pj ? t.ms / t.pj : 0;
  const cell = (o, f) => f == null || o === f ? (o ? `<b>${o}</b>` : '<span class="z">·</span>') : `<span class="d">${o}<i> · ${f}</i></span>`;
  const rows = [...t.rows].sort((a, b) => b.m.date - a.m.date).map(({m, p}) => `
    <tr class="row ${p.dG || p.dE ? 'bad' : ''} ${p.played ? '' : 'np'}" data-act="go" data-h="#/p/${esc(encodeURIComponent(m.id))}">
      <td class="n">${p.num}</td><td class="nm">${esc(fmtDay(new Date(m.date)))} · ${esc(teamShort(m.rival))}</td>
      <td>${p.starter ? '<span class="tw">T</span>' : '<span class="z">·</span>'}</td><td>${p.ms ? mmss(p.ms) : '<span class="z">·</span>'}</td>
      <td>${cell(GOALS(p.ours), p.fcn ? GOALS(p.fcn) : null)}</td><td>${cell(EXCL(p.ours), p.fcn ? EXCL(p.fcn) : null)}</td></tr>`).join('');
  openSheet(`<button class="x" data-act="close" aria-label="Tancar">✕</button>
    <h3>${esc(title(t.name) || '#' + t.num)}</h3>
    <div class="muted small">Dorsal ${Object.keys(t.nums).sort((a, b) => a - b).join(', ')}</div>
    <div class="kpis">
      <div class="kpi"><b>${t.pj}</b><span>Partits</span></div>
      <div class="kpi"><b>${t.tit}</b><span>Titular${t.pj ? ' ' + Math.round(t.tit / t.pj * 100) + '%' : ''}</span></div>
      <div class="kpi"><b>${mins(t.ms)}′</b><span>${t.pj ? 'mitj. ' + mmss(avg) : 'Minuts'}</span></div>
      <div class="kpi ${t.g !== t.gFcn ? 'bad' : ''}"><b>${t.g}</b><span>Gols</span></div>
    </div>
    <table class="cmp" style="margin-top:6px"><thead><tr><th>#</th><th>Partit</th><th>T</th><th>Min</th><th>Gols</th><th>Exp</th></tr></thead><tbody>${rows}</tbody></table>
    <p class="faint small" style="margin-top:8px">Expulsions: ${t.exc}${t.exc !== t.eFcn ? ` (FCN ${t.eFcn})` : ''}${t.outs ? ` · ${t.outs} definitiva` : ''}. En vermell: nosaltres · FCN. Toca un partit per obrir-lo.</p>`);
}

/* ---------- Partit ---------- */
function renderMatch(m) {
  const d0 = new Date(m.date), a = m.acta, f = m.fed;
  const sc = m.ours || m.fScore || {cnt: 0, rival: 0};
  const state = m.live ? 'En joc' : 'Final';
  let h = `<div class="mhead"><div class="sb">
      <button class="back" data-act="go" data-h="" aria-label="Tornar">‹</button>
      <div class="score"><div class="tm">${esc(teamShort(CNT_TEAM))}</div>
        <div><div class="num">${sc.cnt} : ${sc.rival}</div><span class="q">${esc(state)} · ${esc(fmtDay(d0))} ${esc(fmtTime(d0))}</span></div>
        <div class="tm r">${esc(teamShort(m.rival))}</div></div>
      <span style="width:40px;flex:none"></span></div>
    <div class="fedline">${fedPills(m)}</div></div>`;

  if (!a) h += '<div class="notice">D\'aquest partit no tenim acta nostra: només hi ha les dades de la FCN, que no compten als totals.</div>';
  else if (m.friendly) h += '<div class="notice info">Partit amistós: no hi ha acta de la federació per comparar.</div>';
  else if (!m.fReady) h += `<div class="notice info">${f ? 'L\'acta de la FCN encara no té dades de jugadors.' : 'El lector no ha llegit l\'acta de la FCN d\'aquest partit.'} Es mostren només les nostres dades.</div>`;

  // Marcador per quarts
  if (a || m.quarters.some(x => x.fcn)) {
    const qc = (o, fq) => !fq ? '<span class="z">·</span>' : !o || (o[0] === fq[0] && o[1] === fq[1]) ? `${fq[0]}-${fq[1]}` : `<span class="d">${fq[0]}-${fq[1]}</span>`;
    const fT = m.fScore ? [m.fScore.cnt, m.fScore.rival] : null, oT = m.ours ? [m.ours.cnt, m.ours.rival] : null;
    h += `<section class="card"><h2>Marcador per quarts</h2><table class="cmp q"><thead><tr><th></th>${m.quarters.map(x => `<th>Q${x.q}</th>`).join('')}<th>Total</th></tr></thead><tbody>`;
    if (a) h += `<tr><td class="muted small">Nosaltres</td>${m.quarters.map(x => `<td>${x.ours ? x.ours.join('-') : '<span class="z">·</span>'}</td>`).join('')}<td>${oT.join('-')}</td></tr>`;
    if (!m.friendly) h += `<tr><td class="muted small">FCN</td>${m.quarters.map(x => `<td>${qc(x.ours, x.fcn)}</td>`).join('')}<td>${qc(oT, fT)}</td></tr>`;
    h += `</tbody></table>${a && !m.friendly ? '<p class="faint small" style="margin-top:6px">En vermell, el que no quadra amb el nostre marcador.</p>' : ''}</section>`;
  }

  // Jugadors
  const c = (o, fv) => {
    if (fv == null) return o ? `<b>${o}</b>` : '<span class="z">·</span>';
    if (o == null) return fv ? `<span class="f">${fv}</span>` : '<span class="z">·</span>';
    return o === fv ? (o ? `<b>${o}</b>` : '<span class="z">·</span>') : `<span class="d">${o}<i> · ${fv}</i></span>`;
  };
  const cmpN = m.pDiffs;
  h += `<section class="card"><h2>Jugadors · ${esc(teamShort(CNT_TEAM))} ${a && m.fReady ? (cmpN ? `<span class="pill bad">${cmpN} ${cmpN === 1 ? 'diferència' : 'diferències'}</span>` : '<span class="pill ok">tot quadra</span>') : ''}</h2>
    <table class="cmp"><thead><tr><th>#</th><th>Jugador</th><th title="Titular">T</th><th title="Minuts jugats">Min</th><th>Gols</th><th title="Expulsions (faltes personals)">Exp</th></tr></thead><tbody>`;
  if (!m.players.length) h += '<tr><td colspan="6" class="muted small" style="text-align:left">Encara no hi ha dades.</td></tr>';
  for (const p of m.players) {
    const key = m.id + ':' + p.num;
    const fG = p.fcn ? GOALS(p.fcn) : null, fE = p.fcn ? EXCL(p.fcn) : null;
    h += `<tr class="row ${p.dG || p.dE ? 'bad' : ''} ${p.played ? '' : 'np'}" data-act="row" data-k="${esc(key)}">
      <td class="n">${p.num}</td><td class="nm">${esc(short(p.name)) || '<span class="faint">—</span>'}${p.captain ? ' <span class="faint small">(c)</span>' : ''}</td>
      <td>${p.starter ? '<span class="tw">T</span>' : '<span class="z">·</span>'}</td>
      <td>${p.ms ? mmss(p.ms) : '<span class="z">·</span>'}</td>
      <td>${c(a ? GOALS(p.ours) : null, fG)}</td><td>${c(a ? EXCL(p.ours) : null, fE)}${OUTS(p.ours) || OUTS(p.fcn) ? ' ⛔' : ''}</td></tr>`;
    if (openRows.has(key)) {
      const ks = Object.keys(KEYS).filter(k => (p.ours && p.ours[k]) || (p.fcn && p.fcn[k]));
      const parts = ks.map(k => `${esc(KEYS[k])}: ${a ? `<b>${(p.ours && p.ours[k]) || 0}</b>` : ''}${p.fcn ? `${a ? ' · ' : ''}FCN <b>${p.fcn[k] || 0}</b>` : ''}`);
      h += `<tr class="det"><td></td><td colspan="5">${esc(title(p.name))}${p.ms ? ` · ${mmss(p.ms)} jugats` : ''}<br>${parts.join('<br>') || 'Sense gols ni expulsions.'}</td></tr>`;
    }
  }
  h += `</tbody></table>
    <details class="legend"><summary>Llegenda</summary><dl>
      <dt>T</dt><dd>Titular: a l'aigua a l'inici del Q1 (la nostra acta).</dd>
      <dt>Min</dt><dd>Temps de joc (cada quart, 8:00).</dd>
      <dt>Gols</dt><dd>Jugada + penal.</dd>
      <dt>Exp</dt><dd>Expulsions de 20 s + faltes de penal + expulsió i penal. ⛔ expulsió definitiva.</dd>
      <dt><span class="pill bad">3 · 2</span></dt><dd>No quadra: nosaltres · FCN. Toca un jugador per veure-ho per columnes de l'acta.</dd>
    </dl></details></section>`;

  if (f && f.matchId) {
    const url = f.actaUrl || `${ACTAWP}/tournament/${f.tournamentId}/match/${f.matchId}/stats`;
    h += `<p class="small" style="margin:14px 4px 0"><a href="${esc(url)}" target="_blank" rel="noopener">Obre l'acta a l'ACTAWP ↗</a></p>`;
  }
  $('#app').innerHTML = h;
}

function fedPills(m) {
  if (m.friendly) return '<span class="pill">Amistós</span>';
  let h = '';
  if (m.fScore) {
    const same = !m.ours || !m.scoreDiff;
    h += `<span class="pill ${!m.ours ? '' : same ? 'ok' : 'bad'}">FCN ${m.fScore.cnt} : ${m.fScore.rival}${m.ours ? (same ? ' ✓' : ' ≠') : ''}</span>`;
  } else h += '<span class="pill">FCN: sense marcador</span>';
  if (m.live) h += '<span class="pill live">en joc</span>';
  if (m.fed && m.fed.statsAt) h += `<span class="pill">acta FCN llegida ${esc(ago(m.fed.statsAt))}</span>`;
  return h;
}

/* ---------- full inferior ---------- */
function openSheet(html) { $('#sheet').innerHTML = html; $('#sheet').classList.add('show'); $('#shade').classList.add('show'); }
function closeSheet() { $('#sheet').classList.remove('show'); $('#shade').classList.remove('show'); }

/* ============================================================
   Esdeveniments
   ============================================================ */
document.addEventListener('click', e => {
  if (e.target.id === 'shade') return closeSheet();
  const th = e.target.closest('th[data-sort]');
  if (th) {
    const k = th.dataset.sort;
    sort = sort.k === k ? {k, dir: -sort.dir} : {k, dir: SORTS[k][1]};
    LS.set(SORT, sort);
    return render();
  }
  const el = e.target.closest('[data-act]');
  if (!el) return;
  switch (el.dataset.act) {
    case 'go': {
      const h = el.dataset.h;
      if (location.hash === h || (!h && !location.hash)) render(); else location.hash = h;
      window.scrollTo(0, 0); break;
    }
    case 'refresh': refresh(); break;
    case 'player': playerSheet(el.dataset.k); break;
    case 'row': { const k = el.dataset.k; openRows.has(k) ? openRows.delete(k) : openRows.add(k); render(); break; }
    case 'close': closeSheet(); break;
  }
});
window.addEventListener('hashchange', () => { render(); window.scrollTo(0, 0); });
// En tornar a l'app (o cada minut amb un partit en joc), dades noves
document.addEventListener('visibilitychange', () => { if (!document.hidden && Date.now() - S.at > 60e3) refresh(); });
setInterval(() => {
  if (document.hidden) return;
  if (MATCHES.some(m => m.live) && Date.now() - S.at > 55e3) refresh(); else paintUpd();
}, 60e3);

/* ---------- inici: primer el que hi ha al mòbil, després la xarxa ---------- */
const cached = LS.get(CACHE, null);
if (cached && Array.isArray(cached.actas)) { S = cached; build(); }
render();
refresh();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('service-worker.js').catch(() => {}));
}
</script>
