<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CNT Estadístiques</title>
<meta name="description" content="Estadístiques del Juvenil A: el que anotem a l'acta comparat amb l'acta oficial de la federació">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0891b2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CNT Stats">
<link rel="apple-touch-icon" href="../../apple-touch-icon.png">
<link rel="icon" href="../../cnt-ios-192.png">
<style>
/* ============================================================
   CN Terrassa · Estadístiques (app v2)
   Mateix disseny que l'acta en directe (app-nova/acta): light, accent per categoria.
   ============================================================ */
:root{
  --bg:#f4f6f9; --surface:#fff; --surface-2:#f8fafc; --border:#e6eaf0;
  --text:#1e293b; --muted:#64748b; --faint:#94a3b8;
  --accent:#0891b2; --accent-soft:#e0f5fa; --water:#0d9488; --water-soft:#ccfbf1;
  --ok:#16a34a; --ok-soft:#dcfce7; --bad:#dc2626; --bad-soft:#fee2e2; --warn:#b45309; --warn-soft:#fef3c7;
  --radius:14px; --radius-sm:10px;
  --shadow:0 1px 3px rgba(15,23,42,.06),0 4px 16px rgba(15,23,42,.05);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
.cat-juvenil{--accent:#0891b2;--accent-soft:#e0f5fa}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.35;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
a{color:var(--accent)}
.app{max-width:720px;margin:0 auto;padding:0 12px calc(40px + env(safe-area-inset-bottom))}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:.82rem}
h2{font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;margin-top:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 14px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface);font-weight:650;min-height:44px}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:.78rem;font-weight:650;background:var(--surface-2);border:1px solid var(--border);text-transform:none;letter-spacing:0;color:var(--text)}
.pill.ok{background:var(--ok-soft);border-color:transparent;color:#166534}
.pill.bad{background:var(--bad-soft);border-color:transparent;color:#991b1b}
.pill.warn{background:var(--warn-soft);border-color:transparent;color:#92400e}
.pill.live{background:var(--accent-soft);border-color:transparent;color:#155e75}
.notice{margin-top:10px;padding:10px 12px;border-radius:var(--radius-sm);background:var(--warn-soft);color:#78350f;font-size:.88rem;font-weight:600}
.notice.info{background:var(--accent-soft);color:var(--text)}
footer{text-align:center;color:var(--faint);font-size:.78rem;margin-top:22px}
footer a{color:var(--muted)}

/* ---------- Capçalera i pestanyes ---------- */
.top{display:flex;align-items:flex-start;gap:10px;padding:18px 4px 4px}
.top .tt{flex:1;min-width:0}
.brand{font-weight:800;font-size:1.25rem}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--border);background:var(--surface);font-size:1.15rem;flex:none}
.iconbtn.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.tabs{display:flex;gap:4px;margin-top:12px;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:3px}
.tabs button{flex:1;padding:8px 4px;border-radius:9px;font-weight:700;font-size:.9rem;color:var(--muted);min-height:38px}
.tabs button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.upd{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:8px;font-size:.78rem;color:var(--faint);min-height:18px}

/* ---------- Resum de temporada ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.kpi{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:9px 4px 8px;text-align:center;min-width:0}
.kpi b{display:block;font-size:1.2rem;font-weight:850;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi span{display:block;font-size:.66rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:700;margin-top:2px}
.kpi.ok b{color:var(--ok)} .kpi.bad b{color:var(--bad)}

/* ---------- Llista de partits ---------- */
.mrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:11px 4px;border-top:1px solid var(--border)}
.mrow:first-of-type{border-top:0}
.mrow .when{width:70px;flex:none;font-size:.8rem;color:var(--muted);line-height:1.25}
.mrow .when b{display:block;color:var(--text);font-size:.92rem}
.mrow .teams{flex:1;min-width:0;font-size:.92rem}
.mrow .teams div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .teams .rv{font-weight:750}
.mrow .res{flex:none;text-align:right}
.wl{display:inline-block;min-width:54px;text-align:center;padding:3px 8px;border-radius:8px;font-weight:850;font-variant-numeric:tabular-nums;background:var(--surface-2)}
.wl.w{background:var(--ok-soft);color:#166534} .wl.l{background:var(--bad-soft);color:#991b1b}
.st{display:block;font-size:.7rem;font-weight:700;margin-top:4px;color:var(--faint)}
.st.ok{color:var(--ok)} .st.bad{color:var(--bad)} .st.warn{color:var(--warn)} .st.live{color:var(--accent)}

/* ---------- Partit ---------- */
.mhead{position:sticky;top:0;z-index:20;background:var(--bg);margin:0 -12px;padding:8px 12px 8px;border-bottom:1px solid var(--border)}
.sb{display:flex;align-items:center;gap:8px}
.back{width:40px;height:40px;border-radius:12px;border:1px solid var(--border);background:var(--surface);font-size:1.1rem;flex:none}
.score{flex:1;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;min-width:0}
.score .tm{font-size:.8rem;font-weight:700;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score .tm.r{text-align:right}
.score .num{font-size:1.9rem;font-weight:850;font-variant-numeric:tabular-nums;line-height:1;text-align:center;min-width:92px}
.score .q{display:block;font-size:.72rem;font-weight:700;color:var(--accent);text-align:center;margin-top:2px}
.fedline{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px;margin-top:6px;min-height:22px}

/* ---------- Taules: columnes Acta (la nostra) i FCN (la federació) ---------- */
table.cmp{width:100%;border-collapse:collapse;font-size:.86rem;font-variant-numeric:tabular-nums}
table.cmp th{font-size:.7rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700;padding:6px 3px;text-align:center;border-bottom:1px solid var(--border);white-space:nowrap}
table.cmp th:nth-child(2),table.cmp td:nth-child(2){text-align:left}
table.cmp td{padding:8px 3px;text-align:center;border-bottom:1px solid var(--border)}
table.cmp tr.row{cursor:pointer}
table.cmp td.nm{max-width:0;width:40%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
table.cmp td.n{font-weight:800;width:26px}
table.cmp .z{color:var(--faint)}
table.cmp .d{display:inline-block;background:var(--bad-soft);color:#991b1b;border-radius:6px;padding:1px 5px;font-weight:800;white-space:nowrap}
table.cmp .d i{font-style:normal;font-weight:600;opacity:.75}
table.cmp .f{color:var(--muted);font-weight:600}
table.cmp .tw{display:inline-block;border-radius:6px;padding:1px 5px;font-size:.72rem;font-weight:800;background:var(--accent-soft);color:#155e75}
table.cmp tr.bad td:first-child{box-shadow:inset 3px 0 0 var(--bad)}
table.cmp tr.np td{color:var(--faint)}
table.cmp tr.np td.nm{font-weight:500}
table.cmp tr.det td{background:var(--surface-2);text-align:left;font-size:.8rem;color:var(--muted);line-height:1.5}
table.cmp th[data-sort]{cursor:pointer;user-select:none}
table.cmp th.on{color:var(--accent)}
table.cmp th.grp{border-bottom:2px solid var(--border);padding-bottom:3px}
table.cmp th.sub{font-size:.6rem;color:var(--faint);padding-top:3px}
table.cmp .ga{border-left:1px solid var(--border)}
table.qt{font-size:.8rem}
table.qt td,table.qt th{padding-left:2px;padding-right:2px}
table.cmp .qs{display:inline-block;background:var(--accent-soft);color:#155e75;border-radius:6px;padding:1px 4px;font-weight:700}
table.cmp small.qn{display:block;font-size:.66rem;color:var(--accent);font-weight:700;margin-top:1px;white-space:nowrap}
table.cmp tr.sum td{border-bottom:0;font-size:.76rem;color:var(--muted);padding-top:9px}
.seg{display:inline-flex;gap:2px;margin-left:auto;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:2px}
.seg button{padding:5px 10px;border-radius:8px;font-size:.78rem;font-weight:700;color:var(--muted);text-transform:none;letter-spacing:0}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
table.q th:first-child,table.q td:first-child{text-align:left}
table.q td{font-weight:700}
.legend{font-size:.78rem;color:var(--muted);margin-top:10px}
.legend summary{cursor:pointer;font-weight:650}
.legend dl{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin-top:8px}
.legend dt{font-weight:800;color:var(--text)}

/* ---------- Fitxa de jugador ---------- */
.shade{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:70;display:none}
.shade.show{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:80;background:var(--surface);border-radius:20px 20px 0 0;max-height:88vh;overflow:auto;padding:16px 16px calc(20px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .2s;max-width:720px;margin:0 auto}
.sheet.show{transform:translateY(0)}
.sheet h3{font-size:1.05rem;font-weight:800;margin-bottom:2px;padding-right:44px}
.sheet .x{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:10px;border:1px solid var(--border);color:var(--muted)}
.sheet .kpis{margin:12px 0 4px}

/* ---------- Editor de l'acta ---------- */
.btn.primary{background:var(--accent);color:#fff;border-color:transparent}
.btn.ghost{background:transparent;border-style:dashed;color:var(--muted)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.wide{width:100%;margin-top:10px}
.btn:disabled{opacity:.45}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:6px 0 4px}
.chips.qsel{margin-top:12px}
.chip{padding:8px 11px;border-radius:999px;border:1px solid var(--border);background:var(--surface);font-weight:600;font-size:.86rem;white-space:nowrap;min-height:38px}
.chip.on{background:var(--accent);border-color:transparent;color:#fff}
.chip.sel{background:var(--text);border-color:transparent;color:#fff}
.chip.in{box-shadow:inset 0 0 0 2px var(--water)}
.lbl{font-size:.72rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-top:14px}
.lbl .faint{text-transform:none;letter-spacing:0;font-weight:600}
.row2{display:flex;gap:8px;margin-top:18px}
.row2 .btn{flex:1}
.alist{list-style:none}
.alist li{border-top:1px solid var(--border)}
.alist li:first-child{border-top:0}
.alist button{display:flex;align-items:center;gap:6px;width:100%;text-align:left;padding:10px 2px;font-size:.9rem;min-height:44px}
.alist .t{color:var(--muted);width:40px;flex:none;font-variant-numeric:tabular-nums;font-weight:700}
.alist .go{margin-left:auto;color:var(--faint);font-size:1.1rem}
.hint{list-style:none;font-size:.86rem}
.hint li{padding:6px 0;border-top:1px solid var(--border)}
.hint li:first-child{border-top:0}
.ebar{position:fixed;left:0;right:0;bottom:0;z-index:30;max-width:720px;margin:0 auto;display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--border)}
.ebar .btn{flex:1}
body.editing .app{padding-bottom:calc(100px + env(safe-area-inset-bottom))}
.tfield{display:flex;gap:8px;align-items:center;margin:6px 0 4px}
.tfield input{flex:1;min-width:0;text-align:center;font:inherit;font-size:1.3rem;font-weight:800;padding:8px;border:1px solid var(--border);border-radius:10px;font-variant-numeric:tabular-nums;color:var(--text)}
.trow{display:flex;align-items:center;gap:10px;padding:8px 2px;border-top:1px solid var(--border)}
.trow:first-of-type{border-top:0}
.trow .n{font-weight:850;width:24px;text-align:right}
.trow .nm{flex:1;min-width:0;font-size:.88rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow .tt{font-weight:800;font-variant-numeric:tabular-nums;width:46px;text-align:right}
.qbar{width:90px;height:8px;border-radius:4px;background:var(--border);overflow:hidden;flex:none}
.qbar i{display:block;height:100%;background:var(--accent)}
.tw{display:inline-block;border-radius:6px;padding:1px 5px;font-size:.72rem;font-weight:800;background:var(--accent-soft);color:#155e75}
.toast{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(calc(100% + 30px));width:min(680px,calc(100% - 24px));background:#0f172a;color:#fff;border-radius:14px;padding:12px 14px;font-weight:700;font-size:.92rem;box-shadow:0 10px 30px rgba(0,0,0,.25);transition:transform .2s,visibility .2s;visibility:hidden;z-index:90}
.toast.show{transform:translateX(-50%) translateY(0);visibility:visible}
body.editing .toast{bottom:calc(80px + env(safe-area-inset-bottom))}
</style>
</head>
<body class="cat-juvenil">
<div class="app" id="app"></div>
<div class="shade" id="shade"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
/* ============================================================
   Estadístiques del Juvenil A (temporada 2026-27)
   - La NOSTRA acta (app-nova/acta) publica cada partit a Firestore
     matches/acta_* (source:'acta'): gols, exclusions, canvis i titulars.
   - L'acta OFICIAL de la FCN la llegeix actawp_live.py i la deixa a la RTDB
     federacio/{matchId}: per jugador, marcador i parcials.
   Gols i expulsions sempre els nostres; la FCN només per comparar.
   Minuts i titularitat només surten de la nostra acta.
   ============================================================ */
const CAT = 'juvenil';
const CNT_TEAM = 'C.N. TERRASSA A';   // nom exacte a l'ACTAWP
const FS = 'https://firestore.googleapis.com/v1/projects/cnt-wp-stats-bb7dc/databases/(default)/documents';
const RTDB = 'https://cnt-wp-stats-bb7dc-default-rtdb.europe-west1.firebasedatabase.app';
const ACTAWP = 'https://actawp.natacio.cat/ca';
const CACHE = 'stats_v1_cache', SORT = 'stats_v1_sort', PVIEW = 'stats_v1_pview';
const QNAMES = ['I', 'II', 'III', 'IV'];
// Columnes de l'acta (mateixes claus a la nostra acta i a la de la FCN)
const KEYS = {
  G: 'Gols', GP: 'Gols de penal', EX: 'Expulsions de 20 s', P: 'Faltes de penal', EP: 'Expulsió i penal',
  ED: 'Expulsió definitiva disciplinària', EB: 'Expulsió definitiva per brutalitat', EN: 'Expulsió definitiva no disciplinària',
  PF: 'Penals fallats', TG: 'Targeta groga', TV: 'Targeta vermella', G5P: 'Gols a la tanda de penals',
};
const STAT_ORDER = Object.keys(KEYS);
// Etiquetes curtes per a l'editor
const SHORTK = {G: '⚽ Gol', GP: '🎯 Gol de penal', EX: '🟥 Exp. 20 s', P: '✋ Falta de penal', EP: '🟥 Exp. + penal',
  ED: '⛔ Definitiva', EB: '⛔ Brutalitat', EN: '⛔ Def. no disc.', PF: '❌ Penal fallat', TG: '🟨 Groga', TV: '🟥 Vermella', G5P: '🎯 Gol a la tanda'};
// Gols = jugada + penal (la tanda no compta). Expulsions = faltes personals, com el botó EX de l'acta.
const GOALS = s => s ? (s.G || 0) + (s.GP || 0) : 0;
const EXCL = s => s ? (s.EX || 0) + (s.P || 0) + (s.EP || 0) : 0;
const OUTS = s => s ? (s.ED || 0) + (s.EB || 0) + (s.EN || 0) : 0;

/* ---------- utilitats ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toArr = x => Array.isArray(x) ? x.filter(Boolean) : (x && typeof x === 'object' ? Object.values(x) : []);
const norm = s => String(s || '').trim().replace(/\s+/g, ' ').toUpperCase();
const isCnt = n => norm(n) === CNT_TEAM;
const title = s => String(s || '').toLocaleLowerCase('ca').replace(/(^|[\s'’-])(\p{L})/gu, (m, a, b) => a + b.toLocaleUpperCase('ca'));
// "MARC CAMPAÑA SALVADOR" → "Marc Campaña" (taules estretes)
const short = n => title(String(n || '').trim().split(/\s+/).slice(0, 2).join(' '));
// "C.N. ATL BARCELONETA" → "Atl Barceloneta"
const teamShort = n => title(String(n || '').replace(/^(C\.?\s?[NEW]\.?|U\.?\s?E\.?|CLUB\s+NATACI[OÓ])\s+/i, '').trim());
function mmss(ms) { const s = Math.max(0, Math.round(ms / 1000)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
const mins = ms => Math.round(ms / 60000);
function ago(t) {
  if (!t) return '';
  const s = Math.round((Date.now() - t) / 1000);
  if (s < 60) return 'fa ' + Math.max(s, 1) + ' s';
  if (s < 3600) return 'fa ' + Math.round(s / 60) + ' min';
  if (s < 86400) return 'fa ' + Math.round(s / 3600) + ' h';
  return 'fa ' + Math.round(s / 86400) + ' d';
}
const fmtDay = d => d.toLocaleDateString('ca-ES', {weekday: 'short', day: '2-digit', month: '2-digit', timeZone: 'Europe/Madrid'});
const fmtTime = d => d.toLocaleTimeString('ca-ES', {hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Madrid'});
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },
};

/* ============================================================
   Dades
   ============================================================ */
// Valors tipats de l'API REST de Firestore → JSON
function fromFs(v) {
  if (!v || typeof v !== 'object') return null;
  if ('mapValue' in v) return Object.fromEntries(Object.entries(v.mapValue.fields || {}).map(([k, x]) => [k, fromFs(x)]));
  if ('arrayValue' in v) return (v.arrayValue.values || []).map(fromFs);
  if ('integerValue' in v) return Number(v.integerValue);
  if ('doubleValue' in v) return Number(v.doubleValue);
  if ('booleanValue' in v) return v.booleanValue;
  if ('nullValue' in v) return null;
  if ('stringValue' in v) return v.stringValue;
  if ('timestampValue' in v) return v.timestampValue;
  return null;
}
async function getJson(url, opt) {
  const r = await fetch(url, opt);
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  return r.json();
}
// Documents de matches amb un source concret
async function loadSource(source) {
  const rows = await getJson(FS + ':runQuery', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({structuredQuery: {from: [{collectionId: 'matches'}],
      where: {fieldFilter: {field: {fieldPath: 'source'}, op: 'EQUAL', value: {stringValue: source}}}}}),
  });
  return rows.filter(r => r.document).map(r => fromFs({mapValue: {fields: r.document.fields}})).filter(Boolean);
}
// Les nostres actes (una per partit; l'app de l'acta les publica a Firestore)
async function loadActas() {
  const rows = await loadSource('acta').catch(e => { throw new Error('No puc llegir les actes (' + e.message + ')'); });
  return rows.filter(a => a.teamId === CAT);
}
// Actes oficials que ha llegit el lector (només el que fem servir: el minut a minut no cal)
function slimFed(d) {
  const keep = ['matchId', 'tournamentId', 'category', 'datetime', 'home', 'away', 'score', 'periods', 'finished', 'players', 'statsAt', 'actaUrl'];
  return Object.fromEntries(keep.filter(k => d[k] !== undefined).map(k => [k, d[k]]));
}
// Correccions fetes des d'aquesta app: matches/edit_<id de l'acta> amb source:'acta_edit' i sense teamId
// (les regles de Firestore només deixen escriure a matches; sense teamId cap altra app les llista)
const editDoc = id => `${FS}/matches/${encodeURIComponent('edit_' + id)}`;
async function loadEdits() {
  return Object.fromEntries((await loadSource('acta_edit')).filter(e => e.matchId).map(e => [e.matchId, e]));
}
async function loadFeds(extraIds) {
  const ids = new Set(extraIds);
  try { Object.keys(await getJson(`${RTDB}/federacio.json?shallow=true`) || {}).forEach(id => ids.add(id)); } catch (e) {}
  const out = {};
  await Promise.all([...ids].map(async id => {
    try { const d = await getJson(`${RTDB}/federacio/${encodeURIComponent(id)}.json`); if (d) out[id] = slimFed(d); } catch (e) {}
  }));
  return out;
}

let S = {actas: [], feds: {}, edits: {}, at: 0};
let busy = false, err = null;
let MATCHES = [], PLAYERS = [];
const openRows = new Set();
let sort = LS.get(SORT, {k: 'num', dir: 1});
let pview = LS.get(PVIEW, 'resum');   // pestanya Jugadors: 'resum' o 'quarts'

async function refresh() {

  busy = true; err = null; paintUpd();
  try {
    // Si les correccions no es poden llegir, es mantenen les que ja teníem (mai es mostra l'acta sense corregir per error)

  else render();

/* ---------- model ---------- */
// L'acta FCN té dades si algun jugador té algun valor (abans del partit tot surt a zero)
function fedHasData(f) {
  for (const side of ['home', 'away']) for (const p of toArr(f && f.players && f.players[side]))
    for (const k in KEYS) if (p.s && p.s[k]) return true;
  return false;
}
// Columnes de la nostra acta per a un jugador (les actes antigues només tenen gols/exclusions)
function ourStats(j) {
  if (!j || !j.estadistiques) return {};
  const e = j.estadistiques;
  if (e.acta) return e.acta;
  const pen = (e.goalTypes && e.goalTypes.penalty) || 0, epen = (e.exclusionTypes && e.exclusionTypes.penalty) || 0;
  return {G: (e.gols || 0) - pen, GP: pen, EX: (e.exclusions || 0) - epen, P: epen};
}
function rivalStats(r) {
  if (r.acta) return r.acta;
  const pen = (r.goalTypes && r.goalTypes.penalty) || 0, epen = (r.exclusionTypes && r.exclusionTypes.penalty) || 0;
  return {G: (r.gols || 0) - pen, GP: pen, EX: (r.exclusions || 0) - epen, P: epen};
}

/* Format editable d'una acta (el que es corregeix des de l'app i es desa a matches/edit_<id>):
   N = {acts: [{q, team:'cnt'|'rival', num, k}],                 q = 1..4, o 0 si no se sap el quart
        quarters: {1: {len, start: [dorsals], changes: [{t, num, dir:'in'|'out'}]}, ...}}   t = ms de joc del quart */
function normalize(a) {
  const tot = {cnt: new Map(toArr(a.jugadors).map(j => [+j.numero, ourStats(j)])),
               rival: new Map(toArr(a.rivalStats).map(r => [+r.num, rivalStats(r)]))};
  const acts = [], seen = {};
  for (const c of toArr(a.chronologicalActions)) {
    const team = c.team === 'rival' ? 'rival' : 'cnt', num = +c.playerNum;
    const q = Math.min(Math.max(+String(c.quarter || 'q1').slice(1) || 1, 1), 4);
    let k;
    if (c.type === 'goal') k = c.goalType === 'penalty' ? 'GP' : 'G';
    else if (c.type === 'exclusion') {
      // La cronologia no distingeix falta de penal (P) d'expulsió i penal (EP): es reparteixen segons els totals de l'acta
      if (c.exclusionType !== 'penalty') k = 'EX';
      else k = (seen[team + num + 'P'] || 0) < ((tot[team].get(num) || {}).P || 0) ? 'P' : 'EP';
    } else if (c.type === 'penalty-missed') k = 'PF';
    else continue;
    seen[team + num + k] = (seen[team + num + k] || 0) + 1;
    acts.push({q, team, num, k});
  }
  // El que no surt a la cronologia (definitives, targetes, tanda): sense quart
  for (const team of ['cnt', 'rival']) for (const [num, s] of tot[team]) for (const k of STAT_ORDER)
    for (let i = seen[team + num + k] || 0; i < (s[k] || 0); i++) acts.push({q: 0, team, num, k});
  const quarters = {};
  for (let q = 1; q <= 4; q++) {
    const s = a.quarterStartTimes && a.quarterStartTimes['q' + q], e = a.quarterRealEndTimes && a.quarterRealEndTimes['q' + q];
    if (s == null || e == null) continue;
    const len = Math.max(0, e - s);
    const start = q === 1 && toArr(a.starters).length ? toArr(a.starters) : toArr(a.lineups && a.lineups['q' + q]);
    const changes = toArr(a.playerWaterChanges).filter(c => c.quarter === 'q' + q)
      .map(c => ({t: Math.min(Math.max(c.timestamp - s, 0), len), num: +c.playerNum, dir: c.action === 'in' ? 'in' : 'out'}))
      .sort((x, y) => x.t - y.t);
    quarters[q] = {len, start: start.map(Number), changes};
  }
  return {acts, quarters};
}
const quarterOf = (N, q) => N.quarters && N.quarters[q];
// Comptadors per jugador d'un equip: Map dorsal → {G: 2, EX: 1...}
function statsOf(N, team) {
  const m = new Map();
  for (const x of toArr(N.acts)) if (x.team === team) { const s = m.get(x.num) || {}; s[x.k] = (s[x.k] || 0) + 1; m.set(x.num, s); }
  return m;
}
// Marcador total i per quarts a partir de les accions
function scoreOf(N) {
  const sc = {cnt: 0, rival: 0, q: {}};
  for (const x of toArr(N.acts)) {
    if (x.k !== 'G' && x.k !== 'GP') continue;
    sc[x.team]++;
    if (x.q >= 1 && x.q <= 4) { const v = sc.q[x.q] = sc.q[x.q] || [0, 0]; v[x.team === 'cnt' ? 0 : 1]++; }
  }
  return sc;
}
// Simula l'aigua d'un quart: minuts de cada dorsal, moments amb ≠7 a l'aigua i canvis que no fan res
function simQuarter(Q) {
  const ms = {}, bad = [], noop = new Set();
  const inW = new Map(toArr(Q.start).map(n => [n, 0]));
  const order = toArr(Q.changes).map((c, i) => ({...c, i})).sort((x, y) => x.t - y.t || (x.dir === 'out' ? -1 : 1));
  let last = 0;
  const check = to => { if (to > last && inW.size !== 7) bad.push({from: last, to, n: inW.size}); };
  for (const c of order) {
    const t = Math.min(Math.max(c.t, 0), Q.len);
    if (t > last) { check(t); last = t; }
    if (c.dir === 'in') { if (inW.has(c.num)) noop.add(c.i); else inW.set(c.num, t); }
    else if (inW.has(c.num)) { ms[c.num] = (ms[c.num] || 0) + t - inW.get(c.num); inW.delete(c.num); }
    else noop.add(c.i);
  }
  check(Q.len);
  for (const [n, t] of inW) ms[n] = (ms[n] || 0) + Q.len - t;
  return {ms, bad, noop};
}
function inWaterAt(Q, t) {
  const inW = new Set(toArr(Q.start));
  for (const c of [...toArr(Q.changes)].sort((x, y) => x.t - y.t)) { if (c.t > t) break; c.dir === 'in' ? inW.add(c.num) : inW.delete(c.num); }
  return inW;
}
// Temps de joc de cada dorsal (ms), total i per quarts. L'acta publica temps de joc: cada quart acabat dura 8:00.
function playMs(N) {
  const res = {};
  for (let q = 1; q <= 4; q++) {
    const Q = quarterOf(N, q); if (!Q) continue;
    for (const [n, ms] of Object.entries(simQuarter(Q).ms)) {
      if (ms <= 0) continue;
      const r = res[n] = res[n] || {total: 0, q: {}};
      r.total += ms; r.q[q] = (r.q[q] || 0) + ms;
    }
  }
  return res;
}

// nOver: format editable a mostrar en lloc del de l'acta (previsualització de l'editor)
function makeMatch(a, f, nOver) {
  // Si el document de la RTDB no hi és, la còpia de l'acta FCN que va guardar la nostra acta
  if (!f && a && a.fcn && a.fcn.players) {
    f = {players: {home: a.fcn.players.cnt, away: a.fcn.players.rival}, periods: [],
         home: {name: CNT_TEAM}, away: {name: a.rivalTeam}, statsAt: a.fcn.statsAt,
         score: a.fcn.score ? {home: a.fcn.score.cnt, away: a.fcn.score.rival} : null,
         matchId: a.fcn.matchId, tournamentId: a.fcn.tournamentId};
  }
  const edit = a && S.edits ? S.edits[a.id] : null;
  const N = a ? (nOver || (edit && edit.n) || normalize(a)) : null;
  const side = f && isCnt(f.home && f.home.name) ? 'home' : f && isCnt(f.away && f.away.name) ? 'away'
    : (a && a.matchLocation === 'away') ? 'away' : 'home';
  const rs = side === 'home' ? 'away' : 'home';
  const fReady = !!f && fedHasData(f);
  const fScore = f && f.score && f.score.home != null ? {cnt: f.score[side], rival: f.score[rs]} : null;
  const sc = N ? scoreOf(N) : null;
  const ours = sc ? {cnt: sc.cnt, rival: sc.rival} : null;
  const per = f ? toArr(f.periods) : [];
  const quarters = [1, 2, 3, 4].map(q => {
    const p = per.find(x => x.name === QNAMES[q - 1]);
    return {q, ours: sc && (quarterOf(N, q) || sc.q[q]) ? sc.q[q] || [0, 0] : null, fcn: p && p.home != null ? [p[side], p[rs]] : null};
  });

  const ms = N ? playMs(N) : {};
  // Qui era a l'aigua a l'inici de cada quart (només els quarts que s'han començat)
  const lineups = {};
  for (let q = 1; q <= 4; q++) lineups[q] = N && quarterOf(N, q) ? toArr(quarterOf(N, q).start) : null;
  const starters = lineups[1] || [];
  const fl = f && f.players ? toArr(f.players[side]) : [];
  const fBy = new Map(fl.map(p => [+p.num, p]));
  const oBy = new Map((a ? toArr(a.jugadors) : []).map(j => [+j.numero, j]));
  const ourBy = N ? statsOf(N, 'cnt') : new Map();
  const inQ = N ? Object.values(N.quarters || {}).flatMap(Q => [...toArr(Q.start), ...toArr(Q.changes).map(c => c.num)]) : [];
  const nums = [...new Set([...oBy.keys(), ...fBy.keys(), ...ourBy.keys(), ...inQ])].filter(n => n > 0).sort((x, y) => x - y);
  const names = new Map(), rnames = new Map(toArr(f && f.players && f.players[rs]).map(p => [+p.num, p.name || '']));
  const players = [];
  for (const num of nums) {
    const o = oBy.get(num), fp = fBy.get(num);
    const ourName = o && o.nom && !/^#\d+$/.test(o.nom) ? o.nom : '';
    const name = (fp && fp.name) || ourName;
    names.set(num, name);
    const os = N ? (ourBy.get(num) || {}) : null;
    const fs = fReady ? ((fp && fp.s) || {}) : null;
    const t = N ? ((ms[num] && ms[num].total) || 0) : null;
    const qms = N ? ((ms[num] && ms[num].q) || {}) : null;
    const qst = N ? [1, 2, 3, 4].filter(q => lineups[q] && lineups[q].includes(num)) : null;
    const starter = N ? starters.includes(num) : null;
    const played = N ? (t > 0 || starter || qst.length > 0 || GOALS(os) + EXCL(os) + OUTS(os) > 0) : !!(fs && GOALS(fs) + EXCL(fs) + OUTS(fs));
    if (!name && !played && !(fs && GOALS(fs) + EXCL(fs))) continue;   // dorsal buit de la plantilla
    players.push({num, name, key: norm(name) || '#' + num, ours: os, fcn: fs, ms: t, qms, qst, starter, played,
                  captain: !!(fp && fp.captain), dG: !!fs && !!N && GOALS(os) !== GOALS(fs), dE: !!fs && !!N && EXCL(os) !== EXCL(fs)});
  }

  const scoreDiff = !!(ours && fScore && (ours.cnt !== fScore.cnt || ours.rival !== fScore.rival));
  const qDiffs = quarters.filter(x => x.ours && x.fcn && (x.ours[0] !== x.fcn[0] || x.ours[1] !== x.fcn[1])).length;
  const pDiffs = players.reduce((n, p) => n + p.dG + p.dE, 0);
  const date = new Date((f && f.datetime) || (a && a.data) || 0).getTime();
  return {
    id: a ? a.id : 'fed_' + f.matchId, acta: a, fed: f, side, date, N, edit, names, rnames,
    editStale: !!(edit && a && (a.lastUpdate || 0) > (edit.base || 0)),
    rival: (f && f[rs] && f[rs].name) || (a && a.rivalTeam) || 'Rival',
    home: side === 'home', friendly: !!a && !a.fedMatchId,
    live: a ? a.estat !== 'finished' : !f.finished,
    ours, fScore, fReady, quarters, players, scoreDiff, qDiffs, pDiffs, lineups,
    diffs: (a && fReady) ? pDiffs + qDiffs + (scoreDiff ? 1 : 0) : 0,
  };
}

function build() {
  const used = new Set();
  MATCHES = S.actas.map(a => {
    const f = a.fedMatchId ? S.feds[String(a.fedMatchId)] : null;
    if (f) used.add(String(a.fedMatchId));
    return makeMatch(a, f);
  });
  // Partits que el lector ha llegit però dels quals no tenim acta nostra
  for (const [id, f] of Object.entries(S.feds)) {
    if (used.has(id) || f.category !== CAT || !(isCnt(f.home && f.home.name) || isCnt(f.away && f.away.name))) continue;
    if (!fedHasData(f)) continue;   // partit encara no jugat (el lector l'està esperant)
    MATCHES.push(makeMatch(null, f));
  }
  MATCHES.sort((x, y) => y.date - x.date);
  PLAYERS = aggregate(MATCHES.filter(m => m.acta));
}

// Totals per jugador: la clau és el nom (el dorsal pot canviar d'un partit a l'altre)
function aggregate(ms) {
  const map = new Map();
  for (const m of ms) for (const p of m.players) {
    if (!p.played && !(p.fcn && GOALS(p.fcn) + EXCL(p.fcn))) continue;
    let t = map.get(p.key);
    if (!t) map.set(p.key, t = {key: p.key, name: p.name, nums: {}, pj: 0, tit: 0, ms: 0, g: 0, exc: 0, outs: 0,
                                qms: {1: 0, 2: 0, 3: 0, 4: 0}, qst: {1: 0, 2: 0, 3: 0, 4: 0}, qn: {1: 0, 2: 0, 3: 0, 4: 0},
                                gC: 0, gF: 0, eC: 0, eF: 0, cmp: 0, rows: []});
    if (!t.name && p.name) t.name = p.name;
    t.nums[p.num] = (t.nums[p.num] || 0) + 1;
    if (p.played) t.pj++;
    if (p.starter) t.tit++;
    t.ms += p.ms || 0;
    for (let q = 1; q <= 4; q++) {
      t.qms[q] += (p.qms && p.qms[q]) || 0;
      if (p.qst && p.qst.includes(q)) t.qst[q]++;
      if (p.played && m.lineups[q]) t.qn[q]++;   // quarts jugats per l'equip mentre ell hi era convocat
    }
    t.g += GOALS(p.ours); t.exc += EXCL(p.ours); t.outs += OUTS(p.ours);
    if (p.fcn) { t.cmp++; t.gC += GOALS(p.ours); t.gF += GOALS(p.fcn); t.eC += EXCL(p.ours); t.eF += EXCL(p.fcn); }
    t.rows.push({m, p});
  }
  return [...map.values()].map(t => {
    const num = +Object.entries(t.nums).sort((x, y) => y[1] - x[1] || x[0] - y[0])[0][0];   // dorsal més habitual
    return {...t, num};
  });
}

function result(m) {
  const s = m.ours || m.fScore;
  if (!s) return {txt: '–', cls: ''};
  return {txt: `${s.cnt}-${s.rival}`, cls: s.cnt > s.rival ? 'w' : s.cnt < s.rival ? 'l' : ''};
}
function matchStatus(m) {
  if (!m.acta) return {cls: 'warn', txt: 'només FCN'};
  if (m.live) return {cls: 'live', txt: 'en joc'};
  if (m.friendly) return {cls: '', txt: 'amistós'};
  const ed = m.edit ? ' · ✏️' : '';
  if (!m.fReady) return {cls: '', txt: 'sense acta FCN' + ed};
  return m.diffs ? {cls: 'bad', txt: `≠ ${m.diffs} dif.${ed}`} : {cls: 'ok', txt: '✓ quadra' + ed};
}

/* ============================================================
   Pantalles
   ============================================================ */
function route() {
  const h = location.hash;
  if (h.startsWith('#/p/')) return {view: 'match', id: decodeURIComponent(h.slice(4))};
  if (h.startsWith('#/e/')) return {view: 'edit', id: decodeURIComponent(h.slice(4))};
  return {view: h === '#/jugadors' ? 'players' : 'matches'};
}
function render() {
  closeSheet();
  const r = route();
  if (r.view === 'edit') {
    const m = MATCHES.find(x => x.id === r.id);
    if (m && m.acta) { if (!EDIT || EDIT.id !== m.id) startEdit(m); return renderEdit(m); }
    if (!busy && S.at) { location.hash = ''; return; }
  }
  document.body.classList.remove('editing');
  if (r.view === 'match') {
    const m = MATCHES.find(x => x.id === r.id);
    if (m) return renderMatch(m);
    if (!busy && S.at) { location.hash = ''; return; }
  }
  renderHome(r.view === 'players' ? 'players' : 'matches');
}

function updLine() {
  if (busy) return 'Actualitzant…';
  if (err) return '';
  return S.at ? `Actualitzat ${ago(S.at)}` : '';
}
function paintUpd() {
  const u = $('#upd'); if (u) u.textContent = updLine();

}

function renderHome(tab) {

/* ---------- Partits ---------- */
function renderMatches() {
  const ours = MATCHES.filter(m => m.acta && !m.friendly);
  let w = 0, d = 0, l = 0, gf = 0, gc = 0;
  for (const m of ours) {
    gf += m.ours.cnt; gc += m.ours.rival;
    if (m.live) continue;
    if (m.ours.cnt > m.ours.rival) w++; else if (m.ours.cnt < m.ours.rival) l++; else d++;
  }
  const withDiffs = ours.filter(m => m.diffs).length, compared = ours.filter(m => m.fReady).length;
  let h = `<section class="card"><h2>Temporada</h2><div class="kpis">
    <div class="kpi"><b>${ours.length}</b><span>Partits</span></div>
    <div class="kpi"><b>${w}-${d}-${l}</b><span>G-E-P</span></div>
    <div class="kpi"><b>${gf}:${gc}</b><span>Gols</span></div>
    <div class="kpi ${compared ? (withDiffs ? 'bad' : 'ok') : ''}"><b>${compared ? (withDiffs ? withDiffs : '✓') : '–'}</b><span>${withDiffs ? 'amb dif. FCN' : 'Acta FCN'}</span></div>
    </div></section>`;
  h += '<section class="card"><h2>Partits jugats</h2>';
  if (!MATCHES.length) h += '<p class="muted small">Encara no hi ha cap acta publicada. Les actes es fan a l\'app <a href="../acta/">Acta en directe</a>.</p>';
  for (const m of MATCHES) {
    const d0 = new Date(m.date), r = result(m), st = matchStatus(m);
    h += `<button class="mrow" data-act="go" data-h="#/p/${esc(encodeURIComponent(m.id))}">
      <div class="when"><b>${esc(fmtDay(d0))}</b>${esc(fmtTime(d0))}</div>
      <div class="teams"><div class="rv">${esc(teamShort(m.rival))}</div><div class="muted small">${m.friendly ? 'Amistós' : m.home ? 'A casa' : 'A fora'}</div></div>
      <div class="res"><span class="wl ${r.cls}">${esc(r.txt)}</span><span class="st ${st.cls}">${esc(st.txt)}</span></div>
    </button>`;
  }
  return h + '</section>';
}

/* ---------- Jugadors (totals) ---------- */
const SORTS = {
  num: [t => t.num, 1], name: [t => short(t.name || ''), 1], pj: [t => t.pj, -1], tit: [t => t.tit, -1],
  min: [t => t.ms, -1], g: [t => t.g, -1], exc: [t => t.exc, -1],
  q1: [t => t.qms[1], -1], q2: [t => t.qms[2], -1], q3: [t => t.qms[3], -1], q4: [t => t.qms[4], -1],
};
function sortedPlayers() {
  const [f] = SORTS[sort.k] || SORTS.num;
  return [...PLAYERS].sort((a, b) => {
    const x = f(a), y = f(b);
    const c = typeof x === 'string' ? x.localeCompare(y, 'ca') : x - y;
    return c * sort.dir || a.num - b.num;
  });
}
// Dues caselles: el que diu la nostra acta i el que diu la FCN (en vermell si no coincideix).
// null = no n'hi ha dades (sense acta nostra o sense acta FCN).
function pairTds(o, f, bad, mark = '') {
  const acta = o == null ? '<span class="z">–</span>' : o ? `<b>${o}</b>` : '<span class="z">·</span>';
  const fcn = f == null ? '<span class="z">–</span>' : bad ? `<span class="d">${f}</span>` : f ? `<span class="f">${f}</span>` : '<span class="z">·</span>';
  return `<td class="ga">${acta}${mark}</td><td>${fcn}</td>`;
}
// Capçalera de dues files: les columnes de `first` (rowspan=2) i els grups Gols i Exp partits en Acta | FCN
const GRP = l => `<th colspan="2" class="grp">${l}</th>`;
function pairHead(first, golsTh = GRP('Gols'), expTh = GRP('Exp')) {
  return `<tr>${first}${golsTh}${expTh}</tr>
    <tr><th class="sub">Acta</th><th class="sub">FCN</th><th class="sub">Acta</th><th class="sub">FCN</th></tr>`;
}
const LEGEND_PAIR = `<dt>Acta</dt><dd>El que hem anotat nosaltres a l'acta en directe.</dd>
  <dt>FCN</dt><dd>L'acta oficial de la federació. <span class="pill bad">2</span> en vermell quan no coincideix amb la nostra. Un guió (–) vol dir que no hi ha dades.</dd>`;

function renderPlayers() {
  const n = MATCHES.filter(m => m.acta).length, onlyF = MATCHES.filter(m => !m.acta).length;
  const noF = MATCHES.filter(m => m.acta && !m.fReady).length;
  const th = (k, l, t, attrs = '') => `<th data-sort="${k}" class="${sort.k === k ? 'on' : ''} ${attrs.includes('colspan') ? 'grp' : ''}" ${attrs} ${t ? `title="${esc(t)}"` : ''}>${l}${sort.k === k ? (sort.dir > 0 ? ' ▴' : ' ▾') : ''}</th>`;
  let h = `<section class="card"><h2>Totals · ${n} ${n === 1 ? 'partit' : 'partits'}
    <span class="seg"><button class="${pview === 'quarts' ? '' : 'on'}" data-act="pview" data-v="resum">Resum</button><button class="${pview === 'quarts' ? 'on' : ''}" data-act="pview" data-v="quarts">Per quarts</button></span></h2>`;
  if (!PLAYERS.length) return h + '<p class="muted small">Encara no hi ha dades de jugadors.</p></section>';
  if (pview === 'quarts') return h + playersByQuarter(th) + '</section>';
  const r2 = 'rowspan="2"';
  h += `<table class="cmp qt"><thead>${pairHead(
    th('num', '#', '', r2) + th('name', 'Jugador', '', r2) + th('pj', 'PJ', 'Partits jugats', r2) + th('tit', 'Tit', 'Partits de titular', r2) + th('min', 'Min', 'Minuts jugats', r2),
    th('g', 'Gols', 'Ordena pels gols de la nostra acta', 'colspan="2"'),
    th('exc', 'Exp', 'Expulsions (faltes personals): ordena per la nostra acta', 'colspan="2"'))}</thead><tbody>`;
  for (const t of sortedPlayers()) {
    const bG = t.gC !== t.gF, bE = t.eC !== t.eF;
    h += `<tr class="row ${bG || bE ? 'bad' : ''}" data-act="player" data-k="${esc(t.key)}"><td class="n">${t.num}</td><td class="nm">${esc(short(t.name)) || '<span class="faint">—</span>'}</td>
      <td>${t.pj || '<span class="z">·</span>'}</td><td>${t.tit || '<span class="z">·</span>'}</td><td>${t.ms ? mins(t.ms) + '′' : '<span class="z">·</span>'}</td>
      ${pairTds(t.g, t.cmp ? t.gF : null, bG)}${pairTds(t.exc, t.cmp ? t.eF : null, bE, t.outs ? '⛔' : '')}</tr>`;
  }
  h += `</tbody></table>
    <details class="legend" open><summary>Com es compta</summary><dl>
      ${LEGEND_PAIR}
      <dt>PJ</dt><dd>Partits on ha entrat a l'aigua (segons la nostra acta).</dd>
      <dt>Tit</dt><dd>Partits que ha començat a l'aigua al Q1.</dd>
      <dt>Min</dt><dd>Minuts de joc: cada quart són 8:00 de rellotge de partit.</dd>
      <dt>Gols</dt><dd>De jugada i de penal.</dd>
      <dt>Exp</dt><dd>Faltes personals: expulsions de 20 s, faltes de penal i expulsió + penal (com el botó EX de l'acta). ⛔ = alguna expulsió definitiva.</dd>
    </dl></details>`;
  if (noF || onlyF) h += `<p class="faint small" style="margin-top:8px">${noF ? `${noF} ${noF === 1 ? 'partit' : 'partits'} sense acta FCN: la columna FCN no els compta. ` : ''}${onlyF ? `${onlyF} ${onlyF === 1 ? 'partit' : 'partits'} sense acta nostra (no compten als totals).` : ''}</p>`;
  return h + '</section>';
}

// Minuts de cada quart (suma de la temporada) i quantes vegades l'ha començat a l'aigua
function playersByQuarter(th) {
  const qs = [1, 2, 3, 4];
  let h = `<table class="cmp qt"><thead><tr>${th('num', '#')}${th('name', 'Jugador')}${qs.map(q => th('q' + q, 'Q' + q, `Minuts al Q${q}`)).join('')}${th('min', 'Total', 'Minuts jugats')}</tr></thead><tbody>`;
  for (const t of sortedPlayers()) {
    h += `<tr class="row" data-act="player" data-k="${esc(t.key)}"><td class="n">${t.num}</td><td class="nm">${esc(short(t.name)) || '<span class="faint">—</span>'}</td>
      ${qs.map(q => `<td>${t.qms[q] ? mins(t.qms[q]) + '′' : '<span class="z">·</span>'}${t.qst[q] ? `<small class="qn">▶ ${t.qst[q]}/${t.qn[q]}</small>` : ''}</td>`).join('')}
      <td><b>${t.ms ? mins(t.ms) + '′' : '<span class="z">·</span>'}</b></td></tr>`;
  }
  return h + `</tbody></table>
    <p class="faint small" style="margin-top:8px">Minuts de joc a cada quart, sumant tots els partits. <b style="color:var(--accent)">▶ 3/4</b>: ha començat aquell quart a l'aigua 3 vegades en 4 partits jugats.</p>`;
}

function playerSheet(key) {
  const t = PLAYERS.find(x => x.key === key); if (!t) return;
  const avg = t.pj ? t.ms / t.pj : 0;
  const rows = [...t.rows].sort((a, b) => b.m.date - a.m.date).map(({m, p}) => `
    <tr class="row ${p.dG || p.dE ? 'bad' : ''} ${p.played ? '' : 'np'}" data-act="go" data-h="#/p/${esc(encodeURIComponent(m.id))}">
      <td class="n">${p.num}</td><td class="nm">${esc(fmtDay(new Date(m.date)))} · ${esc(teamShort(m.rival))}</td>
      <td>${p.starter ? '<span class="tw">T</span>' : '<span class="z">·</span>'}</td><td>${p.ms ? mmss(p.ms) : '<span class="z">·</span>'}</td>
      ${pairTds(GOALS(p.ours), p.fcn ? GOALS(p.fcn) : null, p.dG)}${pairTds(EXCL(p.ours), p.fcn ? EXCL(p.fcn) : null, p.dE)}</tr>`).join('');
  openSheet(`<button class="x" data-act="close" aria-label="Tancar">✕</button>
    <h3>${esc(title(t.name) || '#' + t.num)}</h3>
    <div class="muted small">Dorsal ${Object.keys(t.nums).sort((a, b) => a - b).join(', ')}</div>
    <div class="kpis">
      <div class="kpi"><b>${t.pj}</b><span>Partits</span></div>
      <div class="kpi"><b>${t.tit}</b><span>Titular${t.pj ? ' ' + Math.round(t.tit / t.pj * 100) + '%' : ''}</span></div>
      <div class="kpi"><b>${mins(t.ms)}′</b><span>${t.pj ? 'mitj. ' + mmss(avg) : 'Minuts'}</span></div>
      <div class="kpi ${t.gC !== t.gF ? 'bad' : ''}"><b>${t.g}</b><span>Gols${t.cmp ? ' · FCN ' + t.gF : ''}</span></div>
    </div>
    <div class="kpis" style="margin-top:0">${[1, 2, 3, 4].map(q => `<div class="kpi"><b>${mins(t.qms[q])}′</b><span>Q${q} · ▶ ${t.qst[q]}/${t.qn[q]}</span></div>`).join('')}</div>
    <table class="cmp qt" style="margin-top:6px"><thead>${pairHead('<th rowspan="2">#</th><th rowspan="2">Partit</th><th rowspan="2">T</th><th rowspan="2">Min</th>')}</thead><tbody>${rows}</tbody></table>
    <p class="faint small" style="margin-top:8px">Acta = la nostra; FCN = la de la federació, en vermell quan no coincideix.${t.outs ? ` ${t.outs} expulsió definitiva.` : ''} Toca un partit per obrir-lo.</p>`);
}

/* ---------- Partit ---------- */
function renderMatch(m) {
  const d0 = new Date(m.date), a = m.acta, f = m.fed;
  const sc = m.ours || m.fScore || {cnt: 0, rival: 0};
  const state = m.live ? 'En joc' : 'Final';
  let h = `<div class="mhead"><div class="sb">
      <button class="back" data-act="go" data-h="" aria-label="Tornar">‹</button>
      <div class="score"><div class="tm">${esc(teamShort(CNT_TEAM))}</div>
        <div><div class="num">${sc.cnt} : ${sc.rival}</div><span class="q">${esc(state)} · ${esc(fmtDay(d0))} ${esc(fmtTime(d0))}</span></div>
        <div class="tm r">${esc(teamShort(m.rival))}</div></div>
      ${a ? `<button class="back" data-act="go" data-h="#/e/${esc(encodeURIComponent(m.id))}" aria-label="Corregir l'acta" title="Corregir l'acta">✏️</button>` : '<span style="width:40px;flex:none"></span>'}</div>
    <div class="fedline">${fedPills(m)}</div></div>`;
  if (m.edit) h += `<div class="notice info">✏️ Acta corregida des de l'app (${esc(fmtDay(new Date(m.edit.updatedAt)))} ${esc(fmtTime(new Date(m.edit.updatedAt)))}).${m.editStale ? " Després s'ha tornat a penjar des del mòbil de l'acta: manen les correccions." : ''} <a href="#/e/${esc(encodeURIComponent(m.id))}">Revisar-les</a></div>`;

  if (!a) h += '<div class="notice">D\'aquest partit no tenim acta nostra: només hi ha les dades de la FCN, que no compten als totals.</div>';
  else if (m.friendly) h += '<div class="notice info">Partit amistós: no hi ha acta de la federació per comparar.</div>';
  else if (!m.fReady) h += `<div class="notice info">${f ? 'L\'acta de la FCN encara no té dades de jugadors.' : 'El lector no ha llegit l\'acta de la FCN d\'aquest partit.'} Es mostren només les nostres dades.</div>`;

  if (a || m.quarters.some(x => x.fcn)) h += quarterTable(m, 'Marcador per quarts');

  // Jugadors
  const cmpN = m.pDiffs;
  h += `<section class="card"><h2>Jugadors · ${esc(teamShort(CNT_TEAM))} ${a && m.fReady ? (cmpN ? `<span class="pill bad">${cmpN} ${cmpN === 1 ? 'diferència' : 'diferències'}</span>` : '<span class="pill ok">tot quadra</span>') : ''}</h2>
    <table class="cmp qt"><thead>${pairHead('<th rowspan="2">#</th><th rowspan="2">Jugador</th><th rowspan="2" title="Titular">T</th><th rowspan="2" title="Minuts jugats">Min</th>')}</thead><tbody>`;
  if (!m.players.length) h += '<tr><td colspan="8" class="muted small" style="text-align:left">Encara no hi ha dades.</td></tr>';
  for (const p of m.players) {
    const key = m.id + ':' + p.num;
    h += `<tr class="row ${p.dG || p.dE ? 'bad' : ''} ${p.played ? '' : 'np'}" data-act="row" data-k="${esc(key)}">
      <td class="n">${p.num}</td><td class="nm">${esc(short(p.name)) || '<span class="faint">—</span>'}${p.captain ? ' <span class="faint small">(c)</span>' : ''}</td>
      <td>${p.starter ? '<span class="tw">T</span>' : '<span class="z">·</span>'}</td>
      <td>${p.ms ? mmss(p.ms) : '<span class="z">·</span>'}</td>
      ${pairTds(a ? GOALS(p.ours) : null, p.fcn ? GOALS(p.fcn) : null, p.dG)}${pairTds(a ? EXCL(p.ours) : null, p.fcn ? EXCL(p.fcn) : null, p.dE, OUTS(p.ours) || OUTS(p.fcn) ? '⛔' : '')}</tr>`;
    if (openRows.has(key)) {
      const ks = Object.keys(KEYS).filter(k => (p.ours && p.ours[k]) || (p.fcn && p.fcn[k]));
      const parts = ks.map(k => `${esc(KEYS[k])}: ${a ? `acta <b>${(p.ours && p.ours[k]) || 0}</b>` : ''}${p.fcn ? `${a ? ' · ' : ''}FCN <b>${p.fcn[k] || 0}</b>` : ''}`);
      h += `<tr class="det"><td></td><td colspan="7">${esc(title(p.name))}${p.ms ? ` · ${mmss(p.ms)} jugats` : ''}<br>${parts.join('<br>') || 'Sense gols ni expulsions.'}</td></tr>`;
    }
  }
  h += `</tbody></table>
    <details class="legend" open><summary>Llegenda</summary><dl>
      ${LEGEND_PAIR}
      <dt>T</dt><dd>Titular: a l'aigua a l'inici del Q1 (la nostra acta).</dd>
      <dt>Min</dt><dd>Temps de joc (cada quart, 8:00).</dd>
      <dt>Gols</dt><dd>Jugada + penal.</dd>
      <dt>Exp</dt><dd>Expulsions de 20 s + faltes de penal + expulsió i penal. ⛔ expulsió definitiva. Toca un jugador per veure el detall per columnes de l'acta.</dd>
    </dl></details></section>`;
  if (a) h += matchQuarters(m);

  if (f && f.matchId) {
    const url = f.actaUrl || `${ACTAWP}/tournament/${f.tournamentId}/match/${f.matchId}/stats`;
    h += `<p class="small" style="margin:14px 4px 0"><a href="${esc(url)}" target="_blank" rel="noopener">Obre l'acta a l'ACTAWP ↗</a></p>`;
  }
  $('#app').innerHTML = h;
}

// Marcador per quarts: la nostra acta i la FCN
function quarterTable(m, h2) {
  const a = m.acta;
  const qc = (o, fq) => !fq ? '<span class="z">·</span>' : !o || (o[0] === fq[0] && o[1] === fq[1]) ? `${fq[0]}-${fq[1]}` : `<span class="d">${fq[0]}-${fq[1]}</span>`;
  const fT = m.fScore ? [m.fScore.cnt, m.fScore.rival] : null, oT = m.ours ? [m.ours.cnt, m.ours.rival] : null;
  let h = `<section class="card"><h2>${esc(h2)}</h2><table class="cmp q"><thead><tr><th></th>${m.quarters.map(x => `<th>Q${x.q}</th>`).join('')}<th>Total</th></tr></thead><tbody>`;
  if (a) h += `<tr><td class="muted small">Acta</td>${m.quarters.map(x => `<td>${x.ours ? x.ours.join('-') : '<span class="z">·</span>'}</td>`).join('')}<td>${oT.join('-')}</td></tr>`;
  if (!m.friendly) h += `<tr><td class="muted small">FCN</td>${m.quarters.map(x => `<td>${qc(x.ours, x.fcn)}</td>`).join('')}<td>${qc(oT, fT)}</td></tr>`;
  return h + `</tbody></table>${a && !m.friendly ? '<p class="faint small" style="margin-top:6px">Acta = la nostra; FCN = la de la federació, en vermell quan no coincideix.</p>' : ''}</section>`;
}

// Minuts de cada jugador a cada quart; en blau, qui era a l'aigua a l'inici del quart
function matchQuarters(m) {
  const qs = [1, 2, 3, 4];
  let h = `<section class="card"><h2>Minuts i inicis per quarts</h2><table class="cmp qt"><thead><tr><th>#</th><th>Jugador</th>${qs.map(q => `<th>Q${q}</th>`).join('')}<th>Total</th></tr></thead><tbody>`;
  for (const p of m.players.filter(x => x.played)) {
    h += `<tr><td class="n">${p.num}</td><td class="nm">${esc(short(p.name)) || '<span class="faint">—</span>'}</td>${qs.map(q => {
      const v = p.qms[q] || 0, st = p.qst.includes(q);
      return `<td>${st ? `<span class="qs">${mmss(v)}</span>` : v ? mmss(v) : '<span class="z">·</span>'}</td>`;
    }).join('')}<td><b>${p.ms ? mmss(p.ms) : '<span class="z">·</span>'}</b></td></tr>`;
  }
  // Han de començar 7 (porter inclòs): si no, a l'acta falta (o sobra) algú a l'aigua
  h += `<tr class="sum"><td></td><td>A l'aigua a l'inici</td>${qs.map(q => {
    const n = m.lineups[q] ? m.lineups[q].length : null;
    return `<td>${n == null ? '<span class="z">·</span>' : n === 7 ? n : `<span class="d" title="Han de ser 7">${n}</span>`}</td>`;
  }).join('')}<td></td></tr>`;
  return h + `</tbody></table><p class="faint small" style="margin-top:8px">En blau, a l'aigua a l'inici del quart. Cada quart són 8:00 de joc.</p></section>`;
}

function fedPills(m) {
  if (m.friendly) return '<span class="pill">Amistós</span>';
  let h = '';
  if (m.fScore) {
    const same = !m.ours || !m.scoreDiff;
    h += `<span class="pill ${!m.ours ? '' : same ? 'ok' : 'bad'}">FCN ${m.fScore.cnt} : ${m.fScore.rival}${m.ours ? (same ? ' ✓' : ' ≠') : ''}</span>`;
  } else h += '<span class="pill">FCN: sense marcador</span>';
  if (m.live) h += '<span class="pill live">en joc</span>';
  if (m.fed && m.fed.statsAt) h += `<span class="pill">acta FCN llegida ${esc(ago(m.fed.statsAt))}</span>`;
  return h;
}

/* ============================================================
   Correccions de l'acta (des d'aquesta app) → Firestore matches/edit_<id>
   Es desa el format editable sencer (accions + quarts) i l'app el fa servir
   en lloc del de l'acta, també per als totals. El mòbil de l'acta no les veu:
   si l'acta es torna a penjar, continuen manant les correccions.
   ============================================================ */
const DRAFT = 'stats_v1_draft_';
let EDIT = null;   // {id, n, dirty, tab: 'acts'|'quarts', q}
let SH = null;     // full obert: {kind: 'act'|'chg'|'newchg', i, x}

// JSON → valors tipats de l'API REST de Firestore (sense SDK)
function fsVal(v) {
  if (v === null || v === undefined) return {nullValue: null};
  if (typeof v === 'boolean') return {booleanValue: v};
  if (typeof v === 'number') return Number.isInteger(v) ? {integerValue: String(v)} : {doubleValue: v};
  if (typeof v === 'string') return {stringValue: v};
  if (Array.isArray(v)) return {arrayValue: {values: v.map(fsVal)}};
  return {mapValue: {fields: Object.fromEntries(Object.entries(v).map(([k, x]) => [k, fsVal(x)]))}};
}

function startEdit(m) {
  const draft = LS.get(DRAFT + m.id, null);
  const q = [1, 2, 3, 4].find(x => quarterOf(m.N, x)) || 1;
  EDIT = draft && draft.n ? {...draft, recovered: true}
    : {id: m.id, n: JSON.parse(JSON.stringify(m.N)), dirty: false, tab: 'acts', q};
}
function touch() { EDIT.dirty = true; EDIT.recovered = false; LS.set(DRAFT + EDIT.id, EDIT); }
const editMatch = () => MATCHES.find(x => x.id === EDIT.id);
const preview = m => makeMatch(m.acta, m.fed, EDIT.n);   // el partit amb les correccions
const cntNums = P => [...P.names.keys()].sort((x, y) => x - y);
function rivalNums(P) {
  const s = new Set([...Array.from({length: 14}, (_, i) => i + 1), ...P.rnames.keys(),
                     ...EDIT.n.acts.filter(x => x.team === 'rival').map(x => x.num)]);
  return [...s].sort((x, y) => x - y);
}
const who = (P, x) => x.team === 'cnt' ? `#${x.num} ${short(P.names.get(x.num) || '')}`.trim()
  : `Rival #${x.num}${P.rnames.get(x.num) ? ' ' + short(P.rnames.get(x.num)) : ''}`;

function renderEdit(m) {
  document.body.classList.add('editing');
  const P = preview(m);
  let h = `<div class="mhead"><div class="sb">
      <button class="back" data-act="eExit" aria-label="Sortir">‹</button>
      <div class="score"><div class="tm">${esc(teamShort(CNT_TEAM))}</div>
        <div><div class="num">${P.ours.cnt} : ${P.ours.rival}</div><span class="q">✏️ Corregint l'acta</span></div>
        <div class="tm r">${esc(teamShort(m.rival))}</div></div>
      <span style="width:40px;flex:none"></span></div>
    <div class="tabs">
      <button class="${EDIT.tab === 'acts' ? 'on' : ''}" data-act="eTab" data-t="acts">Gols i expulsions</button>
      <button class="${EDIT.tab === 'quarts' ? 'on' : ''}" data-act="eTab" data-t="quarts">Titulars i canvis</button>
    </div></div>`;
  if (EDIT.recovered) h += '<div class="notice info">S\'han recuperat unes correccions que no s\'havien desat.</div>';
  if (m.live) h += '<div class="notice">L\'acta encara surt en joc: si es torna a penjar, manaran aquestes correccions.</div>';
  h += EDIT.tab === 'quarts' ? editQuarters(P) : editActs(P);
  h += `<div class="ebar">${m.edit ? '<button class="btn danger" data-act="eRestore">↺ Original</button>' : ''}
    <button class="btn" data-act="eExit">${EDIT.dirty ? 'Descarta' : 'Tanca'}</button>
    <button class="btn primary" data-act="eSave" ${EDIT.dirty ? '' : 'disabled'}>💾 Desa</button></div>`;
  $('#app').innerHTML = h;
}

/* ---------- pestanya Gols i expulsions ---------- */
function editActs(P) {
  let h = quarterTable(P, 'Marcador amb les correccions');
  const hints = P.players.filter(p => p.dG || p.dE);
  if (hints.length) {
    h += `<section class="card"><h2>No quadra amb la FCN</h2><ul class="hint">${hints.map(p => `<li><b>#${p.num} ${esc(short(p.name))}</b>: ${[
      p.dG ? `gols acta ${GOALS(p.ours)} · FCN ${GOALS(p.fcn)}` : '', p.dE ? `exp. acta ${EXCL(p.ours)} · FCN ${EXCL(p.fcn)}` : '',
    ].filter(Boolean).join(' · ')}</li>`).join('')}</ul></section>`;
  } else if (P.fReady) h += '<div class="notice info">✓ Els gols i les expulsions de cada jugador quadren amb la FCN.</div>';
  const acts = EDIT.n.acts.map((x, i) => ({...x, i}));
  for (const q of [1, 2, 3, 4, 0]) {
    const list = acts.filter(x => (x.q || 0) === q);
    if (!q && !list.length) continue;
    const s = q ? P.quarters[q - 1] : null;
    const bad = s && s.ours && s.fcn && s.ours.join() !== s.fcn.join();
    h += `<section class="card"><h2>${q ? 'Q' + q : 'Sense quart'}${s && s.ours ? ` <span class="pill">Acta ${s.ours.join('-')}</span>` : ''}${s && s.fcn ? ` <span class="pill ${bad ? 'bad' : 'ok'}">FCN ${s.fcn.join('-')}</span>` : ''}</h2>
      <ul class="alist">${list.map(x => `<li><button data-act="eAct" data-i="${x.i}">${esc(SHORTK[x.k] || x.k)} <span class="${x.team === 'cnt' ? '' : 'muted'}">· ${esc(who(P, x))}</span><span class="go">›</span></button></li>`).join('')
        || '<li class="muted small" style="padding:8px 2px">Cap acció.</li>'}</ul>
      ${q ? `<button class="btn ghost wide" data-act="eAdd" data-q="${q}">+ Afegeix al Q${q}</button>` : ''}</section>`;
  }
  return h;
}

/* ---------- pestanya Titulars i canvis ---------- */
function editQuarters(P) {
  const qs = [1, 2, 3, 4].filter(q => quarterOf(EDIT.n, q));
  if (!qs.length) return '<section class="card"><p class="muted">Aquesta acta no té cap quart començat.</p></section>';
  if (!qs.includes(EDIT.q)) EDIT.q = qs[0];
  const q = EDIT.q, Q = quarterOf(EDIT.n, q), sim = simQuarter(Q), st = toArr(Q.start);
  let h = `<div class="chips qsel">${qs.map(x => `<button class="chip ${x === q ? 'on' : ''}" data-act="eQ" data-q="${x}">Q${x}</button>`).join('')}</div>`;
  h += `<section class="card"><h2>A l'aigua a l'inici del Q${q} <span class="pill ${st.length === 7 ? 'ok' : 'bad'}">${st.length} de 7</span></h2>
    <p class="muted small">Toca un jugador per posar-lo o treure'l.</p>
    <div class="chips">${cntNums(P).map(n => `<button class="chip ${st.includes(n) ? 'sel' : ''}" data-act="eStart" data-n="${n}">${n} ${esc(short(P.names.get(n) || ''))}</button>`).join('')}</div></section>`;
  const order = toArr(Q.changes).map((c, i) => ({...c, i})).sort((x, y) => x.t - y.t);
  h += `<section class="card"><h2>Canvis del Q${q}</h2>`;
  // Els segons entre tocar "surt" i "entra" a la piscina no són errors: només trams de 10 s o més
  const bad = sim.bad.filter(b => b.to - b.from >= 10e3);
  h += bad.slice(0, 5).map(b => `<div class="notice" style="margin:0 0 8px">⚠️ De ${mmss(b.from)} a ${mmss(b.to)} hi ha ${b.n} a l'aigua (han de ser 7).</div>`).join('');
  if (bad.length > 5) h += `<div class="notice" style="margin:0 0 8px">⚠️ I ${bad.length - 5} trams més amb ≠7 a l'aigua.</div>`;
  h += `<ul class="alist">${order.map(c => `<li><button data-act="eChg" data-i="${c.i}"><span class="t">${mmss(c.t)}</span>${c.dir === 'in' ? '💧 Entra' : '⬅️ Surt'} #${c.num} ${esc(short(P.names.get(c.num) || ''))}${sim.noop.has(c.i) ? ' <span class="pill warn">no fa res</span>' : ''}<span class="go">›</span></button></li>`).join('')
      || '<li class="muted small" style="padding:8px 2px">Cap canvi.</li>'}</ul>
    <button class="btn ghost wide" data-act="eNewChg">+ Afegeix un canvi</button>
    <p class="faint small" style="margin-top:8px">Temps de joc des de l'inici del quart (0:00 a ${mmss(Q.len)}).</p></section>`;
  const rows = Object.entries(sim.ms).map(([n, v]) => [+n, v]).filter(([, v]) => v > 0).sort((x, y) => y[1] - x[1]);
  h += `<section class="card"><h2>Minuts del Q${q}</h2>${rows.map(([n, v]) => `<div class="trow"><span class="n">${n}</span>
    <span class="nm">${esc(short(P.names.get(n) || ''))}${st.includes(n) ? ' <span class="tw">▶</span>' : ''}</span>
    <span class="qbar"><i style="width:${Math.min(100, v / (Q.len || 1) * 100)}%"></i></span><span class="tt">${mmss(v)}</span></div>`).join('')
    || '<p class="muted small">Ningú a l\'aigua.</p>'}</section>`;
  return h;
}

/* ---------- fulls d'edició ---------- */
function actSheet(i, q) {
  SH = {kind: 'act', i, x: i >= 0 ? {...EDIT.n.acts[i]} : {q, team: 'cnt', num: null, k: 'G'}};
  paintSheet();
}
function chgSheet(i) {
  const Q = quarterOf(EDIT.n, EDIT.q);
  if (i >= 0) SH = {kind: 'chg', i, x: {...Q.changes[i]}};
  else {
    const last = toArr(Q.changes).reduce((t, c) => Math.max(t, c.t), 0);
    SH = {kind: 'newchg', i: -1, x: {t: last, out: null, in: null}};
  }
  paintSheet();
}
// Temps de joc (m:ss) → ms; null si no és vàlid
function parseClock(s, len) {
  s = String(s || '').trim().replace(/[,'’]/g, ':').replace('.', ':');
  let m, sec;
  const mm = s.match(/^(\d{1,2}):(\d{1,2})$/);
  if (mm) { m = +mm[1]; sec = mm[2].length === 1 ? +mm[2] * 10 : +mm[2]; }
  else if (/^\d{1,4}$/.test(s)) { const n = s.padStart(3, '0'); m = +n.slice(0, -2); sec = +n.slice(-2); }
  else return null;
  if (sec > 59) return null;
  const t = (m * 60 + sec) * 1000;
  return t > len ? null : t;
}
function paintSheet(keep) {
  const m = editMatch(); if (!m || !SH) return;
  const P = preview(m), x = SH.x;
  const ch = (f, v, l, cls = '') => `<button class="chip ${x[f] === v ? 'sel' : ''} ${cls}" data-act="eSet" data-f="${f}" data-v="${v}">${esc(l)}</button>`;
  const nameOf = n => `${n} ${short(P.names.get(n) || '')}`.trim();
  if (SH.kind === 'act') {
    const nums = x.team === 'cnt' ? cntNums(P) : rivalNums(P);
    return openSheet(`<button class="x" data-act="close" aria-label="Tancar">✕</button>
      <h3>${SH.i >= 0 ? 'Corregir acció' : 'Nova acció'}</h3>
      <div class="lbl">Equip</div><div class="chips">${ch('team', 'cnt', teamShort(CNT_TEAM))}${ch('team', 'rival', teamShort(m.rival))}</div>
      <div class="lbl">Jugador</div><div class="chips">${nums.map(n => ch('num', n, x.team === 'cnt' ? nameOf(n) : String(n))).join('')}</div>
      <div class="lbl">Quart</div><div class="chips">${[1, 2, 3, 4].map(q => ch('q', q, 'Q' + q)).join('')}${x.q === 0 ? ch('q', 0, 'Sense quart') : ''}</div>
      <div class="lbl">Què</div><div class="chips">${STAT_ORDER.map(k => ch('k', k, SHORTK[k])).join('')}</div>
      <div class="row2">${SH.i >= 0 ? '<button class="btn danger" data-act="eDel">Esborra</button>' : ''}
        <button class="btn primary" data-act="eOk" ${x.num == null ? 'disabled' : ''}>${SH.i >= 0 ? 'Desa' : 'Afegeix'}</button></div>`, keep);
  }
  const Q = quarterOf(EDIT.n, EDIT.q);
  const inW = inWaterAt({...Q, changes: toArr(Q.changes).filter((c, i) => i !== SH.i)}, x.t);   // a l'aigua just abans
  const time = `<div class="lbl">Moment (temps de joc del Q${EDIT.q})</div>
    <div class="tfield"><button class="btn" data-act="eNudge" data-d="-5000">−5 s</button>
      <input id="etime" inputmode="decimal" value="${mmss(x.t)}" aria-label="Temps de joc (m:ss)">
      <button class="btn" data-act="eNudge" data-d="5000">+5 s</button></div>
    <div class="faint small" id="eclock">0:00 = inici del quart · al rellotge del marcador: ${mmss(Q.len - x.t)}</div>`;
  const wet = n => inW.has(n) ? 'in' : '';
  if (SH.kind === 'chg') {
    return openSheet(`<button class="x" data-act="close" aria-label="Tancar">✕</button>
      <h3>Corregir canvi · Q${EDIT.q}</h3>${time}
      <div class="lbl">Què</div><div class="chips">${ch('dir', 'in', '💧 Entra')}${ch('dir', 'out', '⬅️ Surt')}</div>
      <div class="lbl">Jugador <span class="faint">(vora verda: a l'aigua en aquell moment)</span></div>
      <div class="chips">${cntNums(P).map(n => ch('num', n, nameOf(n), wet(n))).join('')}</div>
      <div class="row2"><button class="btn danger" data-act="eDel">Esborra</button><button class="btn primary" data-act="eOk">Desa</button></div>`, keep);
  }
  return openSheet(`<button class="x" data-act="close" aria-label="Tancar">✕</button>
    <h3>Nou canvi · Q${EDIT.q}</h3>${time}
    <div class="lbl">Surt <span class="faint">(vora verda: a l'aigua en aquell moment)</span></div>
    <div class="chips">${cntNums(P).map(n => ch('out', n, nameOf(n), wet(n))).join('')}</div>
    <div class="lbl">Entra <span class="faint">(vora verda: ja és a l'aigua)</span></div>
    <div class="chips">${cntNums(P).map(n => ch('in', n, nameOf(n), wet(n))).join('')}</div>
    <div class="row2"><button class="btn primary" data-act="eOk" ${x.out == null && x.in == null ? 'disabled' : ''}>Afegeix</button></div>`, keep);
}
function sheetSet(f, raw) {
  const v = ['num', 'q', 'out', 'in'].includes(f) ? +raw : raw;
  if (f === 'team' && v !== SH.x.team) SH.x.num = null;
  SH.x[f] = (f === 'out' || f === 'in') && SH.x[f] === v ? null : v;   // al canvi nou, tornar a tocar = treure
  paintSheet(true);
}
// El camp de temps es llegeix aquí: si s'escriu i es toca Desa de seguida, el 'change' encara no ha repintat res
function readTime() {
  const inp = $('#etime'); if (!inp) return true;
  const t = parseClock(inp.value, quarterOf(EDIT.n, EDIT.q).len);
  if (t == null) { toast('Escriu el temps com 3:45 (entre 0:00 i 8:00)'); inp.value = mmss(SH.x.t); return false; }
  SH.x.t = t;
  const c = $('#eclock'); if (c) c.textContent = `0:00 = inici del quart · al rellotge del marcador: ${mmss(quarterOf(EDIT.n, EDIT.q).len - t)}`;
  return true;
}
function sheetOk() {
  if (!readTime()) return;
  const x = SH.x;
  if (SH.kind === 'act') {
    if (x.num == null) return;
    if (SH.i >= 0) EDIT.n.acts[SH.i] = x; else EDIT.n.acts.push(x);
  } else {
    const Q = quarterOf(EDIT.n, EDIT.q);
    Q.changes = toArr(Q.changes);
    if (SH.kind === 'chg') Q.changes[SH.i] = {t: x.t, num: x.num, dir: x.dir};
    else {
      if (x.out != null) Q.changes.push({t: x.t, num: x.out, dir: 'out'});
      if (x.in != null) Q.changes.push({t: x.t, num: x.in, dir: 'in'});
    }
    Q.changes.sort((a, b) => a.t - b.t);
  }
  touch(); SH = null; closeSheet(); renderEdit(editMatch());
}
function sheetDel() {
  if (SH.kind === 'act') EDIT.n.acts.splice(SH.i, 1);
  else quarterOf(EDIT.n, EDIT.q).changes.splice(SH.i, 1);
  touch(); SH = null; closeSheet(); renderEdit(editMatch());
}
function setTime(t) {
  const len = quarterOf(EDIT.n, EDIT.q).len;
  SH.x.t = Math.min(Math.max(Math.round(t / 1000) * 1000, 0), len);
  paintSheet(true);
}

/* ---------- desar / descartar ---------- */
function leaveEdit(id) {
  LS.del(DRAFT + id); EDIT = null; SH = null;
  location.hash = '#/p/' + encodeURIComponent(id);
}
async function saveEdits(btn) {
  const m = editMatch(); if (!m) return;
  btn.disabled = true; btn.textContent = 'Desant…';
  const body = {source: 'acta_edit', matchId: m.id, base: m.acta.lastUpdate || 0, updatedAt: Date.now(), n: EDIT.n};
  try {
    const r = await fetch(editDoc(m.id), {
      method: 'PATCH', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({fields: fsVal(body).mapValue.fields}),
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    S.edits = {...S.edits, [m.id]: body}; LS.set(CACHE, S); build();
    toast('✓ Correccions desades');
    leaveEdit(m.id);
  } catch (e) {
    btn.disabled = false; btn.textContent = '💾 Desa';
    toast(navigator.onLine === false ? 'Sense connexió: torna-ho a provar (no es perd res)' : 'No s\'ha pogut desar: ' + e.message);
  }
}
async function restoreOriginal() {
  const m = editMatch(); if (!m) return;
  if (!confirm('Treure totes les correccions i tornar a l\'acta tal com es va penjar?')) return;
  try {
    const r = await fetch(editDoc(m.id), {method: 'DELETE'});
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const edits = {...S.edits}; delete edits[m.id];
    S.edits = edits; LS.set(CACHE, S); build();
    toast('Correccions tretes: es mostra l\'acta original');
    leaveEdit(m.id);
  } catch (e) { toast('No s\'ha pogut fer: ' + e.message); }
}
function exitEdit() {
  if (EDIT.dirty && !confirm('Hi ha correccions sense desar. Les descartes?')) return;
  leaveEdit(EDIT.id);
}

let toastT = null;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 3000);
}

/* ---------- full inferior ---------- */
// keep: es repinta el mateix full sense tornar a dalt
function openSheet(html, keep) {
  const sh = $('#sheet'), top = sh.scrollTop;
  sh.innerHTML = html; sh.classList.add('show'); $('#shade').classList.add('show');
  sh.scrollTop = keep ? top : 0;
}
function closeSheet() { $('#sheet').classList.remove('show'); $('#shade').classList.remove('show'); }

/* ============================================================
   Esdeveniments
   ============================================================ */
document.addEventListener('click', e => {
  if (e.target.id === 'shade') return closeSheet();
  const th = e.target.closest('th[data-sort]');
  if (th) {
    const k = th.dataset.sort;
    sort = sort.k === k ? {k, dir: -sort.dir} : {k, dir: SORTS[k][1]};
    LS.set(SORT, sort);
    return render();
  }
  const el = e.target.closest('[data-act]');
  if (!el) return;
  switch (el.dataset.act) {
    case 'go': {
      const h = el.dataset.h;
      if (location.hash === h || (!h && !location.hash)) render(); else location.hash = h;
      window.scrollTo(0, 0); break;
    }
    case 'refresh': refresh(); break;
    case 'player': playerSheet(el.dataset.k); break;
    case 'pview': pview = el.dataset.v; LS.set(PVIEW, pview); render(); break;
    case 'row': { const k = el.dataset.k; openRows.has(k) ? openRows.delete(k) : openRows.add(k); render(); break; }
    case 'close': closeSheet(); break;
    // editor de l'acta
    case 'eTab': EDIT.tab = el.dataset.t; renderEdit(editMatch()); window.scrollTo(0, 0); break;
    case 'eQ': EDIT.q = +el.dataset.q; renderEdit(editMatch()); break;
    case 'eStart': {
      const Q = quarterOf(EDIT.n, EDIT.q), n = +el.dataset.n, st = toArr(Q.start);
      Q.start = st.includes(n) ? st.filter(x => x !== n) : [...st, n].sort((a, b) => a - b);
      touch(); renderEdit(editMatch()); break;
    }
    case 'eAct': actSheet(+el.dataset.i); break;
    case 'eAdd': actSheet(-1, +el.dataset.q); break;
    case 'eChg': chgSheet(+el.dataset.i); break;
    case 'eNewChg': chgSheet(-1); break;
    case 'eSet': if (readTime()) sheetSet(el.dataset.f, el.dataset.v); break;
    case 'eNudge': if (readTime()) setTime(SH.x.t + +el.dataset.d); break;
    case 'eOk': sheetOk(); break;
    case 'eDel': sheetDel(); break;
    case 'eSave': saveEdits(el); break;
    case 'eRestore': restoreOriginal(); break;
    case 'eExit': exitEdit(); break;
  }
});
document.addEventListener('change', e => { if (e.target.id === 'etime' && SH) readTime(); });
window.addEventListener('hashchange', () => { render(); window.scrollTo(0, 0); });
// En tornar a l'app (o cada minut amb un partit en joc), dades noves
document.addEventListener('visibilitychange', () => { if (!document.hidden && Date.now() - S.at > 60e3) refresh(); });
setInterval(() => {
  if (document.hidden) return;
  if (MATCHES.some(m => m.live) && Date.now() - S.at > 55e3) refresh(); else paintUpd();
}, 60e3);

/* ---------- inici: primer el que hi ha al mòbil, després la xarxa ---------- */
const cached = LS.get(CACHE, null);
if (cached && Array.isArray(cached.actas)) { S = {edits: {}, ...cached}; build(); }
render();
refresh();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('service-worker.js').catch(() => {}));
}
</script>
