name: Acta ACTAWP en directe

# Llegeix l'acta per jugador i el minut a minut dels partits del CNT a l'ACTAWP
# (cada 10 s amb el partit en joc) i els publica a la RTDB (federacio/{matchId})
# perquè l'app app-nova/acta/ els compari en directe.
# El cron demana una execució cada 15 min, però GitHub només n'executa una cada
# 3-9 h. Per això cada execució mira si hi ha un partit del CNT en les 12 h
# següents (uns segons, sense dependències): si n'hi ha, s'hi queda esperant,
# es connecta a l'acta 2 h abans i el segueix fins que acaba. Si el partit no hi
# cap abans del límit de 6 h de GitHub, engega una altra execució (relleu).
# Reserva: el mateix script al PC (`python actawp_live.py --watch`).

on:
  schedule:
    # Cada 15 min, fora de l'hora en punt (menys cua als runners de GitHub)
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      match:
        description: "Id del partit (opcional, per seguir-ne un de concret)"
        required: false
      tournament:
        description: "Id del torneig del partit (obligatori si poses partit)"
        required: false

# Mai dos lectors alhora: si un partit s'està seguint, les execucions noves esperen
concurrency:
  group: actawp-live
  cancel-in-progress: false

permissions:
  contents: read
  actions: write   # el relleu engega aquest mateix workflow

jobs:
  lector:
    # Fixat: ubuntu-latest passa a Ubuntu 26 el 19/10/2026 (Chrome i Python sense provar)
    runs-on: ubuntu-24.04
    timeout-minutes: 355   # màxim de GitHub: 360; l'script plega als 345 i demana relleu

    steps:
      - name: Checkout (només els scripts)
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            actawp_live.py
            actawp_fetch_26_27.py
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Hi ha partit del CNT?
        id: check
        if: ${{ !inputs.match }}
        run: python actawp_live.py --check

      - name: Dependències
        if: ${{ inputs.match || steps.check.outputs.active == 'true' }}
        run: pip install beautifulsoup4 firebase-admin websocket-client

      - name: Segueix l'acta
        id: follow
        if: ${{ inputs.match || steps.check.outputs.active == 'true' }}
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          LECTOR_HOST: github
          ACTAWP_BROWSER: /usr/bin/google-chrome
          MATCH_ID: ${{ inputs.match }}
          TOURNAMENT_ID: ${{ inputs.tournament }}
        run: |
          if [ -n "$MATCH_ID" ]; then
            python actawp_live.py --match "$MATCH_ID" --tournament "$TOURNAMENT_ID"
          else
            python actawp_live.py
          fi

      - name: Relleu (el partit no hi cap en aquesta execució)
        if: ${{ steps.follow.outputs.relay == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run actawp_live.yml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}"
